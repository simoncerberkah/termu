<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#FBF3D0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="TERMU (Ternak Terintegrasi & Modern) — Asisten pencatatan kandang, pakan, kesehatan, dan keputusan usaha peternakan sapi potong dan kambing/domba di Indonesia." />
  <title>TERMU — Ternak Terintegrasi & Modern</title>

  <!-- Tipografi: Outfit (angka metrik tipis modern) & Plus Jakarta Sans (teks antarmuka bersih) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons (ikon garis tipis konsisten) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- QR Code Generator sisi klien (ringan ~15KB, bisa dipindai kamera HP) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            display: ['"Outfit"', '"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            charcoal: '#2B2B2B',
            accent: '#F5D547',
            cream: '#FBF6E3',
            muted: '#8E9096',
          },
          borderRadius: {
            '3xl': '24px',
            '4xl': '30px',
          }
        }
      }
    };
  </script>

  <style>
    /* =========================================================================
       DESIGN SYSTEM TERMU — Apple Liquid Glass + Warm Bento-Grid
       Tetap ringan di HP kandang (tanpa animasi berat), kontras tinggi & lega
    ========================================================================= */
    :root {
      --bg-grad: linear-gradient(135deg, #E5E7EB 0%, #F3F0E6 46%, #FBEFC2 100%);
      --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.76) 0%, rgba(255, 253, 247, 0.56) 100%);
      --glass-strong: linear-gradient(145deg, rgba(255, 255, 255, 0.86) 0%, rgba(255, 253, 248, 0.68) 100%);
      --glass-dark: linear-gradient(155deg, rgba(38, 39, 43, 0.88) 0%, rgba(24, 25, 28, 0.94) 100%);
      --glass-border: rgba(255, 255, 255, 0.82);
      --glass-specular: rgba(255, 255, 255, 0.95);
      --charcoal: #2B2B2B;
      --accent: #F5D547;
      --cream: #FBF6E3;
      --muted: #6E7178;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg-grad);
      background-attachment: fixed;
      color: var(--charcoal);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Cahaya latar lembut statis untuk kedalaman efek refraksi Liquid Glass */
    body::before,
    body::after {
      content: '';
      position: fixed;
      pointer-events: none;
      z-index: 0;
      border-radius: 9999px;
    }
    body::before {
      top: -120px;
      right: -80px;
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, rgba(245, 213, 71, 0.34) 0%, rgba(245, 213, 71, 0.08) 45%, transparent 72%);
    }
    body::after {
      bottom: -140px;
      left: -100px;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.72) 0%, rgba(232, 236, 244, 0.35) 50%, transparent 74%);
    }

    #app-root {
      position: relative;
      z-index: 1;
    }

    /* Angka besar berbobot tipis (light) khas dashboard referensi */
    .font-metric {
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
      letter-spacing: -0.035em;
      line-height: 1.05;
    }

    /* Kartu Bento — Permukaan Liquid Glass ala Apple */
    .bento-card {
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(185%);
      -webkit-backdrop-filter: blur(22px) saturate(185%);
      border-radius: 28px;
      border: 1px solid var(--glass-border);
      box-shadow:
        0 12px 32px rgba(43, 43, 43, 0.055),
        0 2px 6px rgba(43, 43, 43, 0.025),
        inset 0 1.5px 1px var(--glass-specular),
        inset 0 -1px 1px rgba(43, 43, 43, 0.035);
      transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 180ms ease, background-color 180ms ease;
    }
    .bento-card:hover {
      box-shadow:
        0 16px 38px rgba(43, 43, 43, 0.075),
        0 2px 8px rgba(43, 43, 43, 0.03),
        inset 0 1.5px 1px var(--glass-specular),
        inset 0 -1px 1px rgba(43, 43, 43, 0.04);
    }

    /* Kartu Gelap — Dark Smoked Liquid Glass */
    .bento-card-dark {
      background: var(--glass-dark);
      backdrop-filter: blur(24px) saturate(165%);
      -webkit-backdrop-filter: blur(24px) saturate(165%);
      color: #FFFFFF;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        0 20px 44px rgba(20, 20, 22, 0.22),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.2),
        inset 0 -1px 0 rgba(0, 0, 0, 0.35);
    }

    /* Kapsul & Navigasi Liquid Glass (Pill Bar & Floating Controls) */
    .glass-pill {
      background: var(--glass-strong);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.88);
      box-shadow:
        0 8px 24px rgba(43, 43, 43, 0.065),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.96),
        inset 0 -1px 1px rgba(43, 43, 43, 0.03);
    }

    /* Floating Dock Bawah (HP) ala Apple Liquid Glass */
    .glass-dock {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.84) 0%, rgba(250, 249, 245, 0.72) 100%);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow:
        0 14px 36px rgba(43, 43, 43, 0.14),
        0 2px 8px rgba(43, 43, 43, 0.06),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.98);
    }

    /* Elemen Tile / Sub-kartu Kaca Halus di dalam Kartu Bento */
    .glass-tile {
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow:
        0 2px 8px rgba(43, 43, 43, 0.03),
        inset 0 1px 0 rgba(255, 255, 255, 0.92);
    }

    /* Kapsul Kaca Aksen Kuning (Tinted Liquid Glass) */
    .glass-accent {
      background: linear-gradient(135deg, rgba(247, 220, 92, 0.95) 0%, rgba(242, 204, 52, 0.88) 100%);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow:
        0 8px 20px rgba(235, 198, 42, 0.28),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.75);
    }

    /* Overlay Kaca Buram di atas Foto / Ilustrasi */
    .glass-caption {
      background: linear-gradient(135deg, rgba(25, 25, 28, 0.54) 0%, rgba(25, 25, 28, 0.36) 100%);
      backdrop-filter: blur(18px) saturate(165%);
      -webkit-backdrop-filter: blur(18px) saturate(165%);
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    /* Modal Sheet Liquid Glass */
    .glass-modal {
      background: linear-gradient(155deg, rgba(255, 254, 251, 0.92) 0%, rgba(249, 247, 240, 0.84) 100%);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow:
        0 28px 64px rgba(20, 20, 24, 0.22),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.98);
    }

    /* Progress pill berpola garis miring halus khas referensi + kaca */
    .pill-striped {
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(43, 43, 43, 0.065),
        rgba(43, 43, 43, 0.065) 4px,
        transparent 4px,
        transparent 9px
      );
      background-color: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.84);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.92);
    }

    /* Target sentuh minimal 44px untuk dipakai di kandang (HP 360px) */
    .btn-touch {
      min-height: 44px;
      transition: transform 150ms cubic-bezier(0.22, 1, 0.36, 1), background-color 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
    }
    .btn-touch:active {
      transform: scale(0.975);
    }

    /* Perapian Input & Select agar seragam dengan nuansa Liquid Glass */
    input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]),
    select,
    textarea {
      transition: border-color 150ms ease, box-shadow 150ms ease, background-color 150ms ease;
    }
    input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: rgba(43, 43, 43, 0.28) !important;
      box-shadow: 0 0 0 3px rgba(245, 213, 71, 0.42);
    }

    /* Sembunyikan scrollbar di bar horizontal HP agar bersih */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Scrollbar halus */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(43, 43, 43, 0.16);
      border-radius: 999px;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(10px) scale(0.975); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-modal {
      animation: modalIn 190ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Floating AI Chat Button & Drawer (Apple Liquid Glass) */
    .ai-fab {
      background: linear-gradient(145deg, rgba(38, 39, 43, 0.92) 0%, rgba(24, 25, 28, 0.96) 100%);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 14px 34px rgba(20, 20, 24, 0.28),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.24);
      transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 160ms ease;
    }
    .ai-fab:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 38px rgba(20, 20, 24, 0.34), inset 0 1.5px 1px rgba(255, 255, 255, 0.3);
    }
    .ai-drawer {
      background: linear-gradient(155deg, rgba(255, 254, 251, 0.94) 0%, rgba(249, 247, 240, 0.88) 100%);
      backdrop-filter: blur(28px) saturate(195%);
      -webkit-backdrop-filter: blur(28px) saturate(195%);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow:
        0 24px 60px rgba(20, 20, 24, 0.22),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.98);
    }

    /* Gaya cetak rapi untuk Paspor QR Ternak & Laporan Keuangan */
    @media print {
      body { background: #FFFFFF !important; }
      body::before, body::after { display: none !important; }
      .no-print { display: none !important; }
      .print-card, .bento-card {
        background: #FFFFFF !important;
        backdrop-filter: none !important;
        box-shadow: none !important;
        border: 1px solid #D4D4D8 !important;
        break-inside: avoid;
      }
    }

    /* Super App Landing & Marketplace Polish */
    .hero-mesh {
      background:
        radial-gradient(circle at 86% 14%, rgba(245, 213, 71, 0.34) 0%, transparent 48%),
        radial-gradient(circle at 12% 88%, rgba(255, 255, 255, 0.85) 0%, transparent 52%);
    }
    .compare-dock {
      background: linear-gradient(150deg, rgba(32, 33, 37, 0.92) 0%, rgba(22, 23, 26, 0.96) 100%);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 18px 44px rgba(18, 18, 22, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="antialiased selection:bg-[#F5D547] selection:text-[#2B2B2B]">
  <!-- Root Aplikasi -->
  <div id="app-root" class="min-h-screen"></div>

  <!-- Root Modal & Konfirmasi -->
  <div id="modal-root"></div>

  <!-- Root Notifikasi Toast -->
  <div id="toast-root" class="fixed top-4 right-4 left-4 sm:left-auto z-[90] flex flex-col gap-2 pointer-events-none max-w-sm ml-auto"></div>

  <script>
  (() => {
    'use strict';

    /* =========================================================================
       MODULE 1: KONFIGURASI, UTILITAS & INISIALISASI PWA
       (Titik sambung siap dipisah ke /js/utils.js & sw.js)
    ========================================================================= */
    const APP_STAGE = 'Tahap 3 / 3 (Lengkap)';
    const APP_VERSION = '1.0.0';

    // Wordmark resmi TERMU (mempertahankan bentuk asli dari logo baru dengan siluet kepala sapi negative-space transparan)
    const TERMU_LOGO_PATHS = `
      <path d="M 18,2 H 164 Q 180,2 180,18 V 40 Q 180,56 164,56 H 126 Q 122,56 122,60 V 214 Q 122,230 106,230 H 76 Q 60,230 60,214 V 60 Q 60,56 56,56 H 18 Q 2,56 2,40 V 18 Q 2,2 18,2 Z"/>
      <path d="M 204,2 H 328 Q 344,2 344,18 V 39 Q 344,55 328,55 H 250 Q 244,55 244,61 V 84 Q 244,90 250,90 H 318 Q 334,90 334,106 V 125 Q 334,141 318,141 H 250 Q 244,141 244,147 V 171 Q 244,177 250,177 H 328 Q 344,177 344,193 V 214 Q 344,230 328,230 H 204 Q 188,230 188,214 V 18 Q 188,2 204,2 Z"/>
      <path d="M 370,2 H 434 C 476,2 503,32 504,76 C 488,73 472,73 456,77 C 437,72 424,60 414,43 C 410,65 418,86 434,99 C 418,98 402,104 392,115 C 403,128 421,132 437,128 C 441,152 448,176 456,196 C 454,209 456,223 468,230 H 370 Q 354,230 354,214 V 18 Q 354,2 370,2 Z"/>
      <path d="M 502,230 C 514,223 516,209 514,196 C 522,176 529,152 533,128 C 549,132 567,128 578,115 C 568,104 552,98 536,99 C 552,86 560,65 556,43 C 546,60 532,72 512,76 V 18 Q 512,2 528,2 H 562 Q 573,2 579,12 L 613,84 L 647,12 Q 653,2 664,2 H 706 Q 722,2 722,18 V 214 Q 722,230 706,230 H 682 Q 666,230 666,214 V 94 C 656,120 644,127 624,129 C 584,133 558,176 556,230 Z"/>
      <path d="M 754,2 H 778 Q 794,2 794,18 V 138 C 794,162 810,176 830,176 C 850,176 866,162 866,138 V 18 Q 866,2 882,2 H 906 Q 922,2 922,18 V 140 C 922,195 882,230 830,230 C 778,230 738,195 738,140 V 18 Q 738,2 754,2 Z"/>
    `.replace(/\s+/g, ' ').trim();

    const PWA = {
      isOffline: !navigator.onLine,
      swRegistered: false,

      init() {
        // 1. Injeksi Favicon & Web App Manifest dengan wordmark TERMU terbaru (hitam di atas kuning hangat #F5D547)
        try {
          const iconSvgRaw = UI.pwaIconSVGString();
          const iconDataUrl = `data:image/svg+xml,${encodeURIComponent(iconSvgRaw)}`;

          const fav = document.createElement('link');
          fav.rel = 'icon';
          fav.type = 'image/svg+xml';
          fav.href = iconDataUrl;
          document.head.appendChild(fav);

          const appleIcon = document.createElement('link');
          appleIcon.rel = 'apple-touch-icon';
          appleIcon.href = iconDataUrl;
          document.head.appendChild(appleIcon);

          const manifest = {
            name: 'TERMU — Ternak Terintegrasi & Modern',
            short_name: 'TERMU',
            description: 'Asisten pencatatan kandang, pakan, kesehatan, dan keputusan usaha peternakan.',
            start_url: './',
            display: 'standalone',
            background_color: '#F4F2EA',
            theme_color: '#FBF3D0',
            lang: 'id',
            icons: [
              { src: iconDataUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },
              { src: iconDataUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' }
            ]
          };
          const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
          const link = document.createElement('link');
          link.rel = 'manifest';
          link.href = URL.createObjectURL(blob);
          document.head.appendChild(link);
        } catch (e) {}

        // 2. Registrasi Service Worker untuk cache offline saat di-host pada origin HTTPS/localhost
        // (Titik sambung produksi: pindahkan kode SW ke file /sw.js terpisah di root server)
        try {
          if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
            navigator.serviceWorker.register('./sw.js').then(() => {
              this.swRegistered = true;
            }).catch(() => {
              // Di lingkungan preview single-file tanpa file /sw.js fisik, data tetap aman di localStorage
              this.swRegistered = false;
            });
          }
        } catch (e) {}

        window.addEventListener('online', () => {
          this.isOffline = false;
          UI.toast('Kembali terhubung ke internet.', 'info');
          if (Auth.session) App.render();
        });
        window.addEventListener('offline', () => {
          this.isOffline = true;
          UI.toast('Mode offline aktif. Pencatatan tetap berjalan dan tersimpan di perangkat.', 'warning');
          if (Auth.session) App.render();
        });
      }
    };

    const Utils = {
      uid(prefix = 'id') {
        return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
      },

      todayISO() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      },

      daysAgoISO(days) {
        const d = new Date();
        d.setDate(d.getDate() - days);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      },

      daysFromNowISO(days) {
        const d = new Date();
        d.setDate(d.getDate() + days);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      },

      nowTimeStr() {
        const d = new Date();
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      },

      greeting() {
        const h = new Date().getHours();
        if (h < 11) return 'Selamat pagi';
        if (h < 15) return 'Selamat siang';
        if (h < 18) return 'Selamat sore';
        return 'Selamat malam';
      },

      escapeHTML(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      },

      formatRp(num) {
        const n = Math.round(Number(num) || 0);
        const sign = n < 0 ? '-' : '';
        return `${sign}Rp ${Math.abs(n).toLocaleString('id-ID')}`;
      },

      formatRpCompact(num) {
        const n = Number(num) || 0;
        const abs = Math.abs(n);
        const sign = n < 0 ? '-' : '';
        if (abs >= 1000000) return `${sign}Rp ${(abs / 1000000).toFixed(abs % 1000000 === 0 ? 0 : 1).replace('.', ',')} jt`;
        if (abs >= 1000) return `${sign}Rp ${Math.round(abs / 1000)} rb`;
        return `${sign}Rp ${Math.round(abs)}`;
      },

      formatDateID(iso) {
        if (!iso) return '-';
        const parts = iso.split('-');
        if (parts.length !== 3) return iso;
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        return `${Number(parts[2])} ${months[Number(parts[1]) - 1] || ''} ${parts[0]}`;
      },

      formatShortDate(iso) {
        if (!iso) return '-';
        const parts = iso.split('-');
        if (parts.length !== 3) return iso;
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        return `${Number(parts[2])} ${months[Number(parts[1]) - 1] || ''}`;
      },

      calcAgeLabel(birthISO) {
        if (!birthISO) return 'Perkiraan dewasa';
        const b = new Date(birthISO);
        if (isNaN(b.getTime())) return '-';
        const months = Math.max(0, Math.floor((Date.now() - b.getTime()) / (1000 * 60 * 60 * 24 * 30.4)));
        if (months < 12) return `${months} bln`;
        const yr = Math.floor(months / 12);
        const rem = months % 12;
        return rem > 0 ? `${yr} th ${rem} bln` : `${yr} th`;
      },

      async sha256(text) {
        try {
          if (window.crypto && window.crypto.subtle) {
            const data = new TextEncoder().encode(text);
            const hashBuf = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
          }
        } catch (e) {}
        // Fallback deterministik untuk konteks non-HTTPS lokal
        let h1 = 0xdeadbeef ^ text.length, h2 = 0x41c6ce57 ^ text.length;
        for (let i = 0; i < text.length; i++) {
          const ch = text.charCodeAt(i);
          h1 = Math.imul(h1 ^ ch, 2654435761);
          h2 = Math.imul(h2 ^ ch, 1597334677);
        }
        return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
      },

      openWhatsApp(phone, text) {
        const clean = (phone || '').replace(/[^0-9]/g, '').replace(/^0/, '62');
        const url = clean
          ? `https://wa.me/${clean}?text=${encodeURIComponent(text)}`
          : `https://wa.me/?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank', 'noopener,noreferrer');
      },

      // Kompres gambar unggahan dari kamera/galeri agar ringan di localStorage HP
      compressImage(file, maxWidth = 520, quality = 0.72) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('Gagal membaca file gambar.'));
          reader.onload = () => {
            const img = new Image();
            img.onerror = () => reject(new Error('Format gambar tidak didukung.'));
            img.onload = () => {
              const scale = Math.min(1, maxWidth / img.width);
              const w = Math.round(img.width * scale);
              const h = Math.round(img.height * scale);
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      },

      // Generator QR Code SVG sisi klien (menggunakan qrcode-generator + fallback offline)
      generateQRSVG(text, size = 180) {
        try {
          if (typeof window.qrcode === 'function') {
            const qr = window.qrcode(0, 'M');
            qr.addData(text);
            qr.make();
            const count = qr.getModuleCount();
            const pad = 2;
            const total = count + pad * 2;
            let rects = '';
            for (let r = 0; r < count; r++) {
              for (let c = 0; c < count; c++) {
                if (qr.isDark(r, c)) {
                  rects += `<rect x="${c + pad}" y="${r + pad}" width="1" height="1" fill="#2B2B2B"/>`;
                }
              }
            }
            return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" width="${size}" height="${size}" class="rounded-2xl bg-white" role="img" aria-label="QR Code Paspor Ternak"><rect width="${total}" height="${total}" fill="#FFFFFF"/>${rects}</svg>`;
          }
        } catch (e) {}

        // Fallback deterministik saat offline penuh jika script CDN belum di-cache
        const grid = 21;
        let hash = 5381;
        for (let i = 0; i < text.length; i++) hash = ((hash << 5) + hash) ^ text.charCodeAt(i);
        let rects = '';
        const finder = (ox, oy) => {
          rects += `<rect x="${ox}" y="${oy}" width="7" height="7" fill="#2B2B2B"/><rect x="${ox + 1}" y="${oy + 1}" width="5" height="5" fill="#FFFFFF"/><rect x="${ox + 2}" y="${oy + 2}" width="3" height="3" fill="#2B2B2B"/>`;
        };
        finder(1, 1); finder(13, 1); finder(1, 13);
        for (let r = 1; r < grid - 1; r++) {
          for (let c = 1; c < grid - 1; c++) {
            const inF = (r < 9 && c < 9) || (r < 9 && c > 11) || (r > 11 && c < 9);
            if (!inF && (((hash >> ((r * 3 + c) % 24)) ^ (r * 7 + c * 11)) & 1)) {
              rects += `<rect x="${c}" y="${r}" width="1" height="1" fill="#2B2B2B"/>`;
            }
          }
        }
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${grid} ${grid}" width="${size}" height="${size}" class="rounded-2xl bg-white"><rect width="${grid}" height="${grid}" fill="#FFFFFF"/>${rects}</svg>`;
      },

      // Unduh SVG QR sebagai file gambar
      downloadSVG(svgStr, filename) {
        const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      },

    /* =========================================================================
       MODULE 3: PENYIMPANAN LOKAL DENGAN ISOLASI NAMESPACE (demo vs live)
       (Titik sambung: ganti metode loadMode/save dengan Supabase client nanti)
    ========================================================================= */
    const Store = {
      mode: 'demo',
      data: null,

      storageKey(mode) {
        return mode === 'live' ? 'termu_live_db_v1' : 'termu_demo_db_v1';
      },

      async ensureInitialized(mode) {
        const key = this.storageKey(mode);
        const raw = localStorage.getItem(key);
        if (!raw) {
          const initial = mode === 'demo' ? await Seed.createDemoDB() : Seed.createEmptyLiveDB();
          localStorage.setItem(key, JSON.stringify(initial));
          return initial;
        }
        try {
          return JSON.parse(raw);
        } catch (e) {
          const fallback = mode === 'demo' ? await Seed.createDemoDB() : Seed.createEmptyLiveDB();
          localStorage.setItem(key, JSON.stringify(fallback));
          return fallback;
        }
      },

      async loadMode(mode) {
        this.mode = mode === 'live' ? 'live' : 'demo';
        this.data = await this.ensureInitialized(this.mode);
        return this.data;
      },

      save() {
        if (!this.data) return;
        try {
          localStorage.setItem(this.storageKey(this.mode), JSON.stringify(this.data));
        } catch (e) {
          UI.toast('Penyimpanan penuh. Coba hapus foto yang terlalu besar.', 'error');
        }
      },

      async resetDemo() {
        const fresh = await Seed.createDemoDB();
        localStorage.setItem(this.storageKey('demo'), JSON.stringify(fresh));
        if (this.mode === 'demo') this.data = fresh;
        return fresh;
      },

      getActiveAnimals() {
        return (this.data?.animals || []).filter(a => a.status !== 'terjual' && a.status !== 'mati');
      },

      getAnimalWeights(animalId) {
        return (this.data?.weights || [])
          .filter(w => w.animal_id === animalId)
          .sort((a, b) => a.date.localeCompare(b.date));
      },

      getLatestWeight(animal) {
        const list = this.getAnimalWeights(animal.id);
        return list.length ? Number(list[list.length - 1].kg) : Number(animal.entry_weight) || 0;
      },

      getPBBH(animalId) {
        const list = this.getAnimalWeights(animalId);
        if (list.length < 2) return null;
        const prev = list[list.length - 2];
        const curr = list[list.length - 1];
        const days = Math.max(1, Math.round((new Date(curr.date) - new Date(prev.date)) / 86400000));
        return +((curr.kg - prev.kg) / days).toFixed(2);
      },

      getActiveWithdrawal(animalId) {
        const today = Utils.todayISO();
        return (this.data?.health_events || []).find(ev =>
          ev.animal_id === animalId && ev.withdrawal_until && ev.withdrawal_until >= today
        ) || null;
      },

      deleteAnimal(animalId) {
        if (!this.data || !animalId) return false;
        const before = (this.data.animals || []).length;
        this.data.animals = (this.data.animals || []).filter(a => a.id !== animalId);
        if (this.data.animals.length === before) return false;
        this.data.weights = (this.data.weights || []).filter(w => w.animal_id !== animalId);
        this.data.health_events = (this.data.health_events || []).filter(e => e.animal_id !== animalId);
        this.data.reproduction_events = (this.data.reproduction_events || []).filter(r => r.animal_id !== animalId);
        this.data.schedules = (this.data.schedules || []).filter(s => s.animal_id !== animalId);
        this.data.listings = (this.data.listings || []).filter(l => l.animal_id !== animalId);
        this.save();
        return true;
      }
    };

    /* =========================================================================

       (Titik sambung: ganti dengan Supabase Auth nanti)
    ========================================================================= */
    const Auth = {
      SESSION_KEY: 'termu_session_v1',
      session: null,

      loadSession() {
        try {
          const raw = localStorage.getItem(this.SESSION_KEY) || sessionStorage.getItem(this.SESSION_KEY);
          this.session = raw ? JSON.parse(raw) : null;
        } catch (e) {
          this.session = null;
        }
        return this.session;
      },

      saveSession(sess, remember = true) {
        this.session = sess;
        const str = JSON.stringify(sess);
        localStorage.removeItem(this.SESSION_KEY);
        sessionStorage.removeItem(this.SESSION_KEY);
        if (remember) localStorage.setItem(this.SESSION_KEY, str);
        else sessionStorage.setItem(this.SESSION_KEY, str);
      },

      logout() {
        this.session = null;
        localStorage.removeItem(this.SESSION_KEY);
        sessionStorage.removeItem(this.SESSION_KEY);
      },

      isOwner() {
        return this.session?.role === 'pemilik';
      },

      async loginDemoOwner() {
        await Store.loadMode('demo');
        const owner = Store.data.users.find(u => u.role === 'pemilik') || Store.data.users[0];
        this.saveSession({
          userId: owner.id, name: owner.name, contact: owner.contact, role: owner.role, mode: 'demo'
        }, true);
        return owner;
      },

      async login(contact, password, remember = true) {
        const norm = contact.trim().toLowerCase();
        const hash = await Utils.sha256(password);
        // Cek akun di Mode Demo lalu Mode Live
        for (const mode of ['demo', 'live']) {
          const db = await Store.ensureInitialized(mode);
          const found = (db.users || []).find(u => u.contact.toLowerCase() === norm);
          if (found) {
            if (found.passwordHash !== hash) return { ok: false, error: 'Kata sandi yang Anda masukkan salah.' };
            await Store.loadMode(mode);
            this.saveSession({
              userId: found.id, name: found.name, contact: found.contact, role: found.role, mode
            }, remember);
            return { ok: true, user: found, mode };
          }
        }
        return { ok: false, error: 'Akun tidak ditemukan. Silakan daftar baru atau coba Mode Demo.' };
      },

      async register({ name, contact, password, role }) {
        const norm = contact.trim().toLowerCase();
        if (norm === 'demo@termu.id' || norm === 'pekerja@termu.id') {
          return { ok: false, error: 'Email tersebut dipakai akun demo. Gunakan email atau nomor WA Anda sendiri.' };
        }
        await Store.loadMode('live');
        if ((Store.data.users || []).some(u => u.contact.toLowerCase() === norm)) {
          return { ok: false, error: 'Email atau nomor WA ini sudah terdaftar. Silakan masuk.' };
        }
        const hash = await Utils.sha256(password);
        const user = {
          id: Utils.uid('usr'),
          name: name.trim(),
          contact: contact.trim(),
          passwordHash: hash,
          role: role === 'pekerja' ? 'pekerja' : 'pemilik',
          createdAt: Utils.todayISO()
        };
        Store.data.users.push(user);
        Store.save();
        this.saveSession({
          userId: user.id, name: user.name, contact: user.contact, role: user.role, mode: 'live'
        }, true);
        return { ok: true, user };
      }
    };

    /* =========================================================================
       MODULE 5: ASISTEN KEPUTUSAN (BERBASIS ATURAN DATA KANDANG)
    ========================================================================= */
    const DecisionEngine = {
      getSuggestions() {
        const d = Store.data;
        if (!d) return [];
        const items = [];
        const today = Utils.todayISO();
        const active = Store.getActiveAnimals();

        // 1. Masa henti obat aktif
        active.forEach(an => {
          const wd = Store.getActiveWithdrawal(an.id);
          if (wd) {
            items.push({
              id: `wd_${an.id}`,
              level: 'danger',
              title: `Tahan penjualan ${an.name} (${an.id})`,
              reason: `Masih dalam masa henti obat (${wd.treatment}) hingga ${Utils.formatDateID(wd.withdrawal_until)}.`,
              actionLabel: 'Lihat Profil',
              actionPage: 'ternak',
              animalId: an.id
            });
          }
        });

        // 2. Jadwal vaksin / obat cacing terlewat
        (d.schedules || []).filter(s => !s.done && s.date < today).forEach(s => {
          items.push({
            id: `sch_${s.id}`,
            level: 'warning',
            title: `Jadwal terlewat: ${s.title}`,
            reason: `Dijadwalkan ${Utils.formatDateID(s.date)} dan belum ditandai selesai.`,
            actionLabel: 'Cek Kesehatan',
            actionPage: 'kesehatan',
            animalId: s.animal_id || null
          });
        });

        // 3. Pertumbuhan bobot melambat dua penimbangan berturut-turut
        active.forEach(an => {
          const wts = Store.getAnimalWeights(an.id);
          if (wts.length >= 3) {
            const w1 = wts[wts.length - 3], w2 = wts[wts.length - 2], w3 = wts[wts.length - 1];
            const d1 = Math.max(1, Math.round((new Date(w2.date) - new Date(w1.date)) / 86400000));
            const d2 = Math.max(1, Math.round((new Date(w3.date) - new Date(w2.date)) / 86400000));
            const p1 = (w2.kg - w1.kg) / d1;
            const p2 = (w3.kg - w2.kg) / d2;
            const minGain = an.species === 'Sapi' ? 0.45 : 0.05;
            if (p1 < minGain && p2 < minGain) {
              const gainLast = +(w3.kg - w2.kg).toFixed(1);
              items.push({
                id: `slow_${an.id}`,
                level: 'warning',
                title: `Pertumbuhan ${an.name} (${an.id}) melambat`,
                reason: `Karena bobot naik hanya ${gainLast} kg dalam ${d2} hari (2 penimbangan berturut-turut di bawah target).`,
                actionLabel: 'Buka Ternak',
                actionPage: 'ternak',
                animalId: an.id
              });
            }
          }
        });

        // 4. Stok pakan menipis <= 5 hari
        (d.feeds || []).forEach(fd => {
          if (fd.daily_use_kg > 0) {
            const days = Math.floor(fd.stock_kg / fd.daily_use_kg);
            if (days <= 5) {
              items.push({
                id: `fd_${fd.id}`,
                level: 'warning',
                title: `Stok ${fd.name} segera habis`,
                reason: `Tersisa ${fd.stock_kg} kg; diperkirakan habis dalam ±${Math.max(1, days)} hari lagi.`,
                actionLabel: 'Cek Stok Pakan',
                actionPage: 'pakan',
                animalId: null
              });
            }
          }
        });

        // 5. Ternak mendekati titik jual optimal
        const optimalCow = active.find(a => a.species === 'Sapi' && Store.getLatestWeight(a) >= 480 && !Store.getActiveWithdrawal(a.id));
        if (optimalCow) {
          items.push({
            id: `opt_${optimalCow.id}`,
            level: 'success',
            title: `${optimalCow.name} (${optimalCow.id}) mendekati titik jual optimal`,
            reason: `Bobot sudah mencapai ${Store.getLatestWeight(optimalCow)} kg dengan pertumbuhan stabil. Cek estimasi untung sebelum biaya pakan berlebih.`,
            actionLabel: 'Hitung HPP',
            actionPage: 'pakan',
            animalId: optimalCow.id
          });
        }

        return items;
      }
    };

    /* =========================================================================
       MODULE 5B: SKRINING FOTO AI KESEHATAN TERNAK (MODULAR)
       - Default prototype: hasil SIMULASI jujur berlabel jelas "SIMULASI".
       - Titik sambung Gemini Vision API: aktif otomatis jika pengguna mengisi
         API Key sendiri di halaman Pengaturan (tidak pernah disimpan di kode).
       - ATURAN KESELAMATAN: bukan diagnosis & dilarang memberi dosis obat otomatis.
    ========================================================================= */
    const AIHealthScreener = {
      DISCLAIMER: 'Ini skrining awal, bukan diagnosis. Hubungi dokter hewan/petugas kesehatan hewan.',

      async fetchWithBackoff(url, options, maxRetries = 3) {
        let delay = 1000;
        for (let attempt = 0; attempt <= maxRetries; attempt++) {
          const res = await fetch(url, options);
          if (res.ok) return res;
          if (res.status !== 429 && res.status < 500) {
            throw new Error(`HTTP ${res.status}`);
          }
          if (attempt < maxRetries) {
            await new Promise(r => setTimeout(r, delay));
            delay *= 2;
          } else {
            throw new Error(`HTTP ${res.status}`);
          }
        }
      },

      async analyzeImage(imageDataUrl, context = {}) {
        const apiKey = (Store.data?.farm?.gemini_api_key || '').trim();
        const notes = (context.notes || '').trim();
        const animalLabel = context.animalLabel || 'Ternak';

        // 1. Jalur Gemini Vision API (jika pengguna mengisi API key sendiri di Pengaturan)
        if (apiKey) {
          try {
            const match = /^data:(image\/[a-zA-Z0-9.+-]+);base64,(.+)$/.exec(imageDataUrl || '');
            if (match) {
              const mimeType = match[1];
              const base64Data = match[2];
              const promptText = [
                'Anda adalah asisten skrining awal visual ternak (sapi/kambing/domba) untuk peternak di Indonesia.',
                `Data ternak: ${animalLabel}. Catatan peternak: ${notes || 'tidak ada catatan tambahan'}.`,
                'Tugas: amati foto secara hati-hati dan berikan dugaan area kelainan awal (misal kulit, mulut/kuku, atau mata), tingkat keyakinan (Rendah/Sedang/Tinggi dalam persen perkiraan), ringkasan pengamatan visual, dan 3-4 langkah aman awal (seperti isolasi sementara, bersihkan kandang, pantau suhu/nafsu makan, hubungi dokter hewan/mantri hewan).',
                'ATURAN WAJIB: JANGAN mendiagnosis secara pasti dan JANGAN menyebutkan nama obat keras atau dosis obat otomatis.'
              ].join('\n');

              const payload = {
                contents: [{
                  role: 'user',
                  parts: [
                    { text: promptText },
                    { inlineData: { mimeType, data: base64Data } }
                  ]
                }],
                generationConfig: {
                  responseMimeType: 'application/json',
                  responseSchema: {
                    type: 'OBJECT',
                    properties: {
                      area: { type: 'STRING' },
                      suspected: { type: 'STRING' },
                      confidence: { type: 'STRING' },
                      observation: { type: 'STRING' },
                      safe_steps: { type: 'ARRAY', items: { type: 'STRING' } }
                    },
                    required: ['area', 'suspected', 'confidence', 'observation', 'safe_steps']
                  }
                }
              };

              const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${encodeURIComponent(apiKey)}`;
              const res = await this.fetchWithBackoff(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              const json = await res.json();
              const text = json?.candidates?.[0]?.content?.parts?.[0]?.text;
              if (text) {
                const parsed = JSON.parse(text);
                return {
                  isSimulation: false,
                  sourceLabel: 'GEMINI VISION API',
                  area: parsed.area || 'Pemeriksaan Umum',
                  suspected: parsed.suspected || 'Perlu pemeriksaan langsung petugas kesehatan hewan',
                  confidence: parsed.confidence || 'Sedang',
                  observation: parsed.observation || 'Pengamatan awal dari foto yang diunggah.',
                  safeSteps: Array.isArray(parsed.safe_steps) && parsed.safe_steps.length
                    ? parsed.safe_steps
                    : [
                        'Pisahkan sementara ternak di sekat karantina/observasi.',
                        'Pastikan air minum bersih dan pakan mudah dikonsumsi.',
                        'Hubungi dokter hewan atau petugas kesehatan hewan dinas setempat.'
                      ],
                  disclaimer: this.DISCLAIMER
                };
              }
            }
          } catch (err) {
            UI.toast('Koneksi Gemini Vision gagal atau API Key tidak valid. Menampilkan hasil SIMULASI.', 'warning');
          }
        }

        // 2. Jalur Default Prototype: SIMULASI lokal deterministik (jujur berlabel SIMULASI)
        await new Promise(r => setTimeout(r, 750));
        const lower = notes.toLowerCase();
        let scenario;

        if (lower.includes('mulut') || lower.includes('liur') || lower.includes('kuku') || lower.includes('pincang')) {
          scenario = {
            area: 'Mulut / Kuku',
            suspected: 'Dugaan lesi/iritasi pada area mulut atau celah kuku (contoh simulasi)',
            confidence: 'Perkiraan Sedang (Simulasi)',
            observation: 'Berdasarkan catatan gejala dan pratinjau foto, area mulut/kuku perlu perhatian prioritas karena berpotensi menular ke ternak satu sekat.',
            safeSteps: [
              'Segera pisahkan ternak ke sekat terpisah (isolasi) agar tidak kontak langsung dengan ternak lain.',
              'Batasi lalu lintas alas kaki dan peralatan pakan antar sekat; cuci bersih setelah menangani ternak ini.',
              'Berikan pakan lembut dan air minum bersih secukupnya, catat suhu/nafsu makan.',
              'Hubungi dokter hewan atau mantri hewan setempat untuk pemeriksaan klinis langsung.'
            ]
          };
        } else if (lower.includes('mata') || lower.includes('belek') || lower.includes('berair') || lower.includes('merah')) {
          scenario = {
            area: 'Mata',
            suspected: 'Dugaan iritasi atau peradangan ringan pada permukaan mata (contoh simulasi)',
            confidence: 'Perkiraan Sedang (Simulasi)',
            observation: 'Terlihat indikasi area sekitar mata perlu pembersihan kandang dari debu/lalat dan pemeriksaan oleh petugas.',
            safeSteps: [
              'Tempatkan ternak di area teduh agar mata tidak terpapar sinar matahari langsung dan debu.',
              'Jaga kebersihan lantai sekat untuk mengurangi populasi lalat di sekitar kepala ternak.',
              'Hindari memberikan salep atau obat tetes sembarangan tanpa arahan tenaga medis hewan.',
              'Kirim foto dan data ternak ini ke dokter hewan via WhatsApp untuk tindak lanjut.'
            ]
          };
        } else {
          scenario = {
            area: 'Kulit / Permukaan Tubuh',
            suspected: 'Dugaan iritasi kulit, keropeng, atau benjolan lokal (contoh simulasi)',
            confidence: 'Perkiraan Sedang (Simulasi)',
            observation: 'Skrining simulasi mendeteksi perlu pengecekan lanjutan pada permukaan kulit dan kebersihan alas kandang.',
            safeSteps: [
              'Pisahkan sementara dari ternak sehat jika ditemukan luka terbuka atau keropeng yang meluas.',
              'Pastikan kandang kering, bersih dari kotoran basah, dan sirkulasi udara lancar.',
              'Pantau nafsu makan serta perkembangan area kulit dalam 24 jam ke depan.',
              'Konsultasikan ke dokter hewan/petugas kesehatan hewan sebelum memberikan pengobatan apa pun.'
            ]
          };
        }

        return {
          isSimulation: true,
          sourceLabel: 'SIMULASI (PROTOTYPE)',
          ...scenario,
          disclaimer: this.DISCLAIMER
        };
      }
    };

    /* =========================================================================
       MODULE 5C: ASISTEN AI CHAT & PREDIKSI DATA KANDANG
       - Membaca data real kandang (bobot, PBBH, stok pakan, kesehatan, jadwal).
       - Terhubung ke Gemini API (gemini-3-flash-preview) dengan backoff,
         serta fallback analisis prediktif lokal otomatis saat offline.
       - Menghormati batasan peran Pekerja (tidak membuka data kas pemilik)
         dan tidak memberikan diagnosis medis / dosis obat otomatis.
    ========================================================================= */
    const AIChatAssistant = {
      predictAnimal(an) {
        const latestW = Store.getLatestWeight(an);
        const rawPbbh = Store.getPBBH(an.id);
        const defaultPbbh = an.species === 'Sapi' ? 0.8 : 0.11;
        const pbbh = rawPbbh !== null ? rawPbbh : defaultPbbh;
        const proj30 = +(latestW + Math.max(0, pbbh) * 30 * 0.95).toFixed(1);
        const proj60 = +(latestW + Math.max(0, pbbh) * 60 * 0.88).toFixed(1);
        const targetW = an.species === 'Sapi' ? 500 : 40;
        const gap = Math.max(0, targetW - latestW);
        const daysToTarget = gap === 0 ? 0 : (pbbh > 0.02 ? Math.ceil(gap / pbbh) : null);
        const wd = Store.getActiveWithdrawal(an.id);
        return { latestW, pbbh, hasMeasuredPbbh: rawPbbh !== null, proj30, proj60, targetW, daysToTarget, wd };
      },

      getFarmPredictionsSummary() {
        const d = Store.data || {};
        const active = Store.getActiveAnimals();
        const cows = active.filter(a => a.species === 'Sapi');
        const group = cows.length ? cows : active;
        const preds = active.map(an => ({ an, ...this.predictAnimal(an) }));
        const groupPreds = group.map(an => ({ an, ...this.predictAnimal(an) }));

        const avgNow = groupPreds.length ? +(groupPreds.reduce((s, x) => s + x.latestW, 0) / groupPreds.length).toFixed(1) : 0;
        const avg30 = groupPreds.length ? +(groupPreds.reduce((s, x) => s + x.proj30, 0) / groupPreds.length).toFixed(1) : 0;
        const avg60 = groupPreds.length ? +(groupPreds.reduce((s, x) => s + x.proj60, 0) / groupPreds.length).toFixed(1) : 0;

        const readyCandidates = preds
          .filter(x => !x.wd && x.an.status !== 'mati' && x.an.status !== 'terjual')
          .sort((a, b) => (b.latestW / b.targetW) - (a.latestW / a.targetW));

        const lowFeeds = (d.feeds || [])
          .filter(f => f.daily_use_kg > 0)
          .map(f => ({ ...f, daysLeft: Math.floor(f.stock_kg / f.daily_use_kg) }))
          .sort((a, b) => a.daysLeft - b.daysLeft);

        const slowGrowers = preds.filter(x => x.hasMeasuredPbbh && x.pbbh < (x.an.species === 'Sapi' ? 0.45 : 0.05));
        const withdrawals = preds.filter(x => x.wd);

        return {
          totalActive: active.length,
          groupLabel: cows.length ? 'Sapi' : 'Ternak',
          avgNow, avg30, avg60,
          preds, readyCandidates, lowFeeds, slowGrowers, withdrawals,
          suggestions: DecisionEngine.getSuggestions()
        };
      },

      buildFarmContext() {
        const d = Store.data || {};
        const isOwner = Auth.isOwner();
        const today = Utils.todayISO();
        const sum = this.getFarmPredictionsSummary();
        const pens = d.pens || [];

        const animalLines = sum.preds.slice(0, 35).map(x => {
          const pen = pens.find(p => p.id === x.an.pen_id);
          return `- ${x.an.id} (${x.an.name}), ${x.an.species} ${x.an.breed}, ${x.an.sex}, Sekat ${pen ? pen.code : '-'}, status: ${x.an.status}, bobot kini: ${x.latestW} kg, PBBH: ${x.pbbh} kg/hr, prediksi +30hr: ${x.proj30} kg, +60hr: ${x.proj60} kg${x.wd ? `, MASA HENTI OBAT s/d ${x.wd.withdrawal_until}` : ''}${x.an.ready_for_sale ? ', siap jual' : ''}`;
        }).join('\n');

        const feedLines = (d.feeds || []).map(f => {
          const days = f.daily_use_kg > 0 ? Math.floor(f.stock_kg / f.daily_use_kg) : '-';
          return `- ${f.name}: stok ${f.stock_kg} kg, pakai ${f.daily_use_kg} kg/hr (habis ±${days} hr), harga Rp${f.price}/kg, PK ${f.pk}%, TDN ${f.tdn}%`;
        }).join('\n');

        const schedLines = (d.schedules || []).filter(s => !s.done).slice(0, 10).map(s =>
          `- ${s.date} (${s.category}): ${s.title}${s.date < today ? ' [TERLEWAT]' : ''}`
        ).join('\n');

        const tasksToday = (d.tasks || []).filter(t => t.date === today);
        const tasksDone = tasksToday.filter(t => t.done).length;

        let financeBlock = 'Data keuangan dibatasi karena pengguna login sebagai Pekerja Kandang.';
        if (isOwner) {
          const txs = d.transactions || [];
          const totalIn = txs.filter(t => t.type === 'income').reduce((s, x) => s + (Number(x.amount) || 0), 0);
          const totalOut = txs.filter(t => t.type === 'expense').reduce((s, x) => s + (Number(x.amount) || 0), 0);
          const feedToday = (d.feed_logs || []).filter(l => l.date === today).reduce((s, x) => s + (Number(x.cost) || 0), 0);
          financeBlock = `Pemasukan total: ${Utils.formatRp(totalIn)}, Pengeluaran total: ${Utils.formatRp(totalOut)}, Arus kas bersih: ${Utils.formatRp(totalIn - totalOut)}, Biaya pakan hari ini: ${Utils.formatRp(feedToday)} (anggaran ${Utils.formatRp(d.farm?.daily_feed_budget || 500000)}/hr).`;
        }

        return [
          `Tanggal hari ini: ${today}`,
          `Peternakan: ${d.farm?.name || '-'} (${d.farm?.location || '-'}) | Mode: ${Store.mode.toUpperCase()} | Peran pengguna: ${Auth.session?.role || 'pemilik'}`,
          `Ringkasan populasi: ${sum.totalActive} ekor aktif. Rata-rata bobot ${sum.groupLabel}: ${sum.avgNow} kg (prediksi +30hr: ${sum.avg30} kg, +60hr: ${sum.avg60} kg).`,
          `Tugas hari ini selesai: ${tasksDone}/${tasksToday.length}.`,
          `Keuangan: ${financeBlock}`,
          `Daftar ternak aktif:\n${animalLines || '(belum ada ternak)'}`,
          `Stok bahan pakan:\n${feedLines || '(belum ada bahan pakan)'}`,
          `Jadwal belum selesai:\n${schedLines || '(tidak ada jadwal tertunda)'}`
        ].join('\n\n');
      },

      localFallbackAnswer(question) {
        const q = (question || '').toLowerCase();
        const sum = this.getFarmPredictionsSummary();
        const d = Store.data || {};
        const isOwner = Auth.isOwner();

        if (sum.totalActive === 0) {
          return 'Saat ini belum ada data ternak di kandang Anda. Tambahkan minimal 1 ekor ternak dan riwayat bobotnya terlebih dahulu agar saya bisa menghitung prediksi pertumbuhan, pakan, dan waktu jual.';
        }

        // 1. Cek jika user menyebut ID atau nama ternak tertentu
        const matched = sum.preds.find(x =>
          q.includes(x.an.id.toLowerCase()) ||
          (x.an.name && x.an.name.length >= 3 && q.includes(x.an.name.toLowerCase()))
        );
        if (matched) {
          const x = matched;
          const estValNow = Math.round(x.latestW * (x.an.species === 'Sapi' ? 62000 : 85000));
          const estVal30 = Math.round(x.proj30 * (x.an.species === 'Sapi' ? 62000 : 85000));
          return [
            `**Analisis & Prediksi ${x.an.name} (${x.an.id})**`,
            `• Jenis/Ras: ${x.an.species} ${x.an.breed} (${x.an.sex}) — status: **${x.an.status}**`,
            `• Bobot terakhir: **${x.latestW} kg** (PBBH: **${x.pbbh} kg/hari**)`,
            `• Prediksi bobot **30 hari ke depan**: **±${x.proj30} kg**`,
            `• Prediksi bobot **60 hari ke depan**: **±${x.proj60} kg**`,
            x.wd
              ? `• **Peringatan:** Masih dalam masa henti obat (${x.wd.treatment}) hingga **${Utils.formatDateID(x.wd.withdrawal_until)}**. Jangan dijual atau dipotong dulu.`
              : (x.daysToTarget === 0
                ? `• **Status Jual:** Sudah mencapai bobot optimal (${x.targetW} kg+). Layak dipertimbangkan untuk dijual.`
                : `• Perkiraan mencapai bobot target ${x.targetW} kg: **±${x.daysToTarget || '-'} hari lagi**.`),
            isOwner ? `• Estimasi nilai pasar acuan (Rp${x.an.species === 'Sapi' ? '62 rb' : '85 rb'}/kg): kini ${Utils.formatRp(estValNow)} → +30 hari sekitar ${Utils.formatRp(estVal30)}.` : ''
          ].filter(Boolean).join('\n');
        }

        // 2. Pertanyaan tentang stok pakan / biaya pakan
        if (q.includes('pakan') || q.includes('stok') || q.includes('ransum') || q.includes('habis')) {
          if (!sum.lowFeeds.length) return 'Belum ada bahan pakan dengan pemakaian harian tercatat. Silakan isi di menu **Pakan & Biaya**.';
          const lines = sum.lowFeeds.map(f =>
            `• **${f.name}**: tersisa ${f.stock_kg} kg (pakai ${f.daily_use_kg} kg/hr) → diperkirakan habis **±${Math.max(1, f.daysLeft)} hari lagi**${f.daysLeft <= 5 ? ' ⚠️ **Segera restok**' : ''}`
          );
          const urgent = sum.lowFeeds.filter(f => f.daysLeft <= 5);
          return [
            `**Prediksi Stok Pakan Kandang**`,
            ...lines,
            urgent.length
              ? `\n**Saran:** Prioritaskan pembelian **${urgent.map(u => u.name).join(', ')}** dalam 1–2 hari agar pemberian ransum tidak terganggu.`
              : `\nSemua stok pakan terpantau aman untuk lebih dari 5 hari ke depan.`
          ].join('\n');
        }

        // 3. Pertanyaan tentang keuangan / untung / kas
        if (q.includes('uang') || q.includes('kas') || q.includes('untung') || q.includes('laba') || q.includes('rugi') || q.includes('modal')) {
          if (!isOwner) {
            return 'Maaf, ringkasan buku kas dan keuangan khusus untuk akun **Pemilik**. Namun saya tetap bisa membantu prediksi bobot ternak, stok pakan, dan jadwal kandang.';
          }
          const txs = d.transactions || [];
          const totalIn = txs.filter(t => t.type === 'income').reduce((s, x) => s + (Number(x.amount) || 0), 0);
          const totalOut = txs.filter(t => t.type === 'expense').reduce((s, x) => s + (Number(x.amount) || 0), 0);
          const estAsset = sum.preds.reduce((s, x) => s + Math.round(x.latestW * (x.an.species === 'Sapi' ? 62000 : 85000)), 0);
          return [
            `**Ringkasan Keuangan & Nilai Aset Ternak**`,
            `• Total pemasukan tercatat: **${Utils.formatRp(totalIn)}**`,
            `• Total pengeluaran tercatat: **${Utils.formatRp(totalOut)}**`,
            `• Arus kas bersih: **${Utils.formatRp(totalIn - totalOut)}**`,
            `• Perkiraan nilai aset ${sum.totalActive} ekor aktif saat ini: **±${Utils.formatRp(estAsset)}**`,
            `\nUntuk menghitung titik puncak untung per ekor terhadap biaya pakan harian, Anda juga bisa membuka **Keuangan → Waktu Jual Terbaik**.`
          ].join('\n');
        }

        // 4. Pertanyaan tentang kesehatan / perhatian / sakit / vaksin
        if (q.includes('sehat') || q.includes('sakit') || q.includes('vaksin') || q.includes('perhatian') || q.includes('obat') || q.includes('henti')) {
          const today = Utils.todayISO();
          const overdue = (d.schedules || []).filter(s => !s.done && s.date < today);
          return [
            `**Pantauan Kesehatan & Perhatian Kandang**`,
            sum.withdrawals.length
              ? `• **Masa henti obat aktif (${sum.withdrawals.length} ekor):** ${sum.withdrawals.map(x => `${x.an.name} (${x.an.id}) s/d ${Utils.formatDateID(x.wd.withdrawal_until)}`).join('; ')}.`
              : `• Tidak ada ternak dalam masa henti obat aktif.`,
            sum.slowGrowers.length
              ? `• **Pertumbuhan melambat (${sum.slowGrowers.length} ekor):** ${sum.slowGrowers.map(x => `${x.an.name} (${x.an.id}, PBBH ${x.pbbh} kg/hr)`).join('; ')}. Evaluasi nafsu makan, obat cacing, dan kecukupan ransum.`
              : `• Tren pertumbuhan seluruh ternak terpantau stabil.`,
            overdue.length
              ? `• **Jadwal terlewat (${overdue.length}):** ${overdue.map(s => `${s.title} (${Utils.formatShortDate(s.date)})`).join('; ')}.`
              : `• Tidak ada jadwal vaksin/kesehatan yang terlewat.`,
            `\n_Catatan: Ini ringkasan berbasis data kandang, bukan diagnosis medis. Hubungi dokter hewan/mantri hewan jika ada gejala sakit._`
          ].join('\n');
        }

        // 5. Pertanyaan tentang prediksi bobot / jual / panen
        if (q.includes('prediksi') || q.includes('bobot') || q.includes('jual') || q.includes('panen') || q.includes('berat') || q.includes('tumbuh')) {
          const top3 = sum.readyCandidates.slice(0, 3);
          return [
            `**Prediksi Pertumbuhan & Kandidat Jual (${sum.totalActive} Ekor Aktif)**`,
            `• Rata-rata bobot ${sum.groupLabel} saat ini: **${sum.avgNow} kg**`,
            `• Prediksi rata-rata **+30 hari**: **±${sum.avg30} kg** | **+60 hari**: **±${sum.avg60} kg**`,
            `\n**3 Kandidat Terdekat Siap Jual (bebas masa henti obat):**`,
            ...top3.map((x, idx) =>
              `${idx + 1}. **${x.an.name} (${x.an.id})** — kini ${x.latestW} kg (PBBH ${x.pbbh} kg/hr) → prediksi +30 hr **${x.proj30} kg**${x.daysToTarget === 0 ? ' *(Sudah optimal)*' : ''}`
            ),
            sum.slowGrowers.length
              ? `\n⚠️ **Perlu evaluasi:** ${sum.slowGrowers.map(x => `${x.an.name} (${x.an.id})`).join(', ')} pertumbuhannya lebih lambat dari rata-rata.`
              : ''
          ].filter(Boolean).join('\n');
        }

        // 6. Default: Ringkasan menyeluruh + saran tindakan
        const topReady = sum.readyCandidates[0];
        const lowestFeed = sum.lowFeeds[0];
        return [
          `**Ringkasan Prediksi ${d.farm?.name || 'Kandang Anda'}**`,
          `• **Populasi:** ${sum.totalActive} ekor aktif (rata-rata ${sum.groupLabel} **${sum.avgNow} kg**, diprediksi mencapai **±${sum.avg30} kg** dalam 30 hari).`,
          topReady ? `• **Kandidat jual terdepan:** ${topReady.an.name} (${topReady.an.id}) bobot ${topReady.latestW} kg (proyeksi +30 hr: ${topReady.proj30} kg).` : '',
          lowestFeed ? `• **Stok pakan paling cepat habis:** ${lowestFeed.name} (±${Math.max(1, lowestFeed.daysLeft)} hari lagi).` : '',
          sum.suggestions.length ? `• **Prioritas hari ini:** ${sum.suggestions[0].title} — ${sum.suggestions[0].reason}` : '• Tidak ada peringatan mendesak hari ini.',
          `\nAnda bisa bertanya spesifik, misalnya *"Prediksi bobot ${topReady ? topReady.an.id : 'SP-001'} 30 hari lagi"* atau *"Kapan stok pakan habis?"*.`
        ].filter(Boolean).join('\n');
      },

      async ask(question, history = []) {
        const cleanQ = (question || '').trim();
        if (!cleanQ) return null;

        // Jika offline, langsung pakai mesin prediksi lokal agar respons instan
        if (!navigator.onLine) {
          return {
            text: this.localFallbackAnswer(cleanQ),
            source: 'Analisis Lokal (Offline)'
          };
        }

        const farmContext = this.buildFarmContext();
        const systemPrompt = [
          'Kamu adalah Asisten AI TERMU (Ternak Terintegrasi & Modern) untuk peternak sapi potong dan kambing/domba di Indonesia.',
          'Gunakan Bahasa Indonesia yang ramah, ringkas, jelas, dan mudah dipahami di kandang.',
          'TUGAS: Baca data kandang di bawah ini secara akurat, jawab pertanyaan pengguna, dan berikan prediksi kuantitatif (bobot 30/60 hari berdasarkan PBBH, kandidat waktu jual, perkiraan habisnya stok pakan, dan prioritas perhatian).',
          'ATURAN WAJIB:',
          '1. Gunakan HANYA angka dari data kandang yang diberikan; jangan mengarang data ternak atau statistik palsu.',
          '2. Sebutkan secara jujur bahwa proyeksi bobot/waktu jual adalah estimasi berdasarkan tren penimbangan tercatat.',
          '3. JANGAN pernah memberikan diagnosis penyakit pasti atau dosis obat otomatis. Selalu sarankan hubungi dokter hewan/mantri hewan jika ada indikasi sakit.',
          '4. Jika pengguna berperan sebagai "pekerja", jangan tampilkan angka buku kas/keuangan pemilik.',
          '5. Format jawaban rapi dengan poin singkat dan penebalan seperlunya (**teks**).',
          '',
          '=== DATA KANDANG SAAT INI ===',
          farmContext
        ].join('\n');

        const recentTurns = history.slice(-6).map(m => ({
          role: m.role === 'user' ? 'user' : 'model',
          parts: [{ text: m.text }]
        }));
        recentTurns.push({ role: 'user', parts: [{ text: cleanQ }] });

        const apiKey = (Store.data?.farm?.gemini_api_key || '').trim();
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${encodeURIComponent(apiKey)}`;

        try {
          const res = await AIHealthScreener.fetchWithBackoff(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: recentTurns,
              systemInstruction: { parts: [{ text: systemPrompt }] }
            })
          }, 2);
          const json = await res.json();
          const reply = json?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (reply && reply.trim()) {
            return { text: reply.trim(), source: 'Gemini AI' };
          }
        } catch (err) {
          // Fallback diam-diam ke mesin prediksi lokal berbasis data asli
        }

        return {
          text: this.localFallbackAnswer(cleanQ),
          source: 'Analisis Prediksi Lokal'
        };
      },

      formatMessageHTML(text) {
        const escaped = Utils.escapeHTML(text || '');
        return escaped
          .replace(/\*\*(.+?)\*\*/g, '<strong class="font-semibold text-[#2B2B2B]">$1</strong>')
          .replace(/_(.+?)_/g, '<em class="opacity-80">$1</em>')
          .replace(/\n/g, '<br />');
      }
    };

      async checkHashPassport(shouldRender = false) {
        const hash = window.location.hash || '';
        if (hash.startsWith('#paspor=')) {
          const params = new URLSearchParams(hash.slice(1));
          const pid = params.get('paspor');
          const mode = params.get('mode') === 'live' ? 'live' : 'demo';
          if (pid) {
            this.publicPassportId = pid;
            this.publicPassportMode = mode;
            await Store.ensureInitialized(mode);
            if (!Store.data || Store.mode !== mode) {
              await Store.loadMode(mode);
            }
            if (shouldRender) this.render();
          }
        }
      },

        if (screen === 'kandang') {

            this.appScreen = 'login';
          } else {

        } else {

      bindMarketplaceEvents() {
        const goLanding = document.getElementById('mp-go-landing');
        if (goLanding) goLanding.onclick = () => this.openSuperAppScreen('landing');

        const swKandang = document.getElementById('mp-switch-kandang');
        if (swKandang) swKandang.onclick = () => this.openSuperAppScreen('kandang');

        const btnLogin = document.getElementById('mp-btn-login');
        if (btnLogin) btnLogin.onclick = () => this.openSuperAppScreen('login');

        const favTop = document.getElementById('mp-tab-fav-btn');
        if (favTop) {
          favTop.onclick = () => {
            this.marketTab = this.marketTab === 'favorit' ? 'semua' : 'favorit';
            this.render();
          };
        }

        const openSell = document.getElementById('mp-open-ternak-sell');
        if (openSell) {
          openSell.onclick = () => {
            this.navigate('ternak');
            UI.toast('Pilih ternak lalu klik "Tandai Siap Jual" untuk menampilkannya di Pasar TERMU.', 'info');
          };
        }

        document.querySelectorAll('[data-mp-tab]').forEach(btn => {
          btn.onclick = () => {
            this.marketTab = btn.dataset.mpTab;
            this.render();
          };
        });

        const bindMF = (id, key) => {
          const el = document.getElementById(id);
          if (!el) return;
          el.onchange = () => {
            this.marketFilter[key] = el.value;
            this.render();
          };
        };
        bindMF('mp-search', 'search');
        bindMF('mp-species', 'species');
        bindMF('mp-city', 'city');
        bindMF('mp-sort', 'sort');
        bindMF('mp-minkg', 'minKg');
        bindMF('mp-maxkg', 'maxKg');

        const rstBtn = document.getElementById('mp-reset-filter');
        if (rstBtn) {
          rstBtn.onclick = () => {
            this.marketTab = 'semua';
            this.marketFilter = { search: '', species: 'all', city: 'all', sort: 'newest', minKg: '', maxKg: '' };
            this.render();
          };
        }

        document.querySelectorAll('[data-mp-fav]').forEach(btn => {
          btn.onclick = () => {
            const added = Marketplace.toggleFavorite(btn.dataset.mpFav);
            UI.toast(added ? 'Disimpan ke daftar Favorit Anda.' : 'Dihapus dari Favorit.', 'info');
            this.render();
          };
        });

        document.querySelectorAll('[data-mp-cmp]').forEach(btn => {
          btn.onclick = () => {
            const id = btn.dataset.mpCmp;
            if (this.compareIds.includes(id)) {
              this.compareIds = this.compareIds.filter(x => x !== id);
            } else {
              if (this.compareIds.length >= 2) {
                this.compareIds = [this.compareIds[1], id];
                UI.toast('Maksimal 2 ternak untuk dibandingkan. Pilihan diperbarui.', 'info');
              } else {
                this.compareIds.push(id);
              }
            }
            this.render();
          };
        });

        const clrCmp = document.getElementById('mp-clear-cmp');
        if (clrCmp) clrCmp.onclick = () => { this.compareIds = []; this.render(); };

        const openCmp = document.getElementById('mp-open-cmp');
        if (openCmp) openCmp.onclick = () => this.openCompareModal();

        document.querySelectorAll('[data-mp-qr]').forEach(btn => {
          btn.onclick = () => this.openMarketplacePassportModal(btn.dataset.mpQr);
        });

        document.querySelectorAll('[data-mp-wa]').forEach(btn => {
          btn.onclick = () => {
            const item = Marketplace.findById(btn.dataset.mpWa);
            if (!item) return;
            const msg = `Halo ${item.farmName}, saya melihat ${item.name} (${item.animal_id}, ${item.species} ${item.breed}, bobot ${item.weight} kg, penawaran ${Utils.formatRp(item.price)}) di Pasar TERMU. Apakah ternak ini masih tersedia?`;
            Utils.openWhatsApp(item.phone, msg);
          };
        });
      },

      openCompareModal() {
        const items = this.compareIds.map(id => Marketplace.findById(id)).filter(Boolean);
        if (items.length < 2) return UI.toast('Pilih 2 ternak untuk dibandingkan.', 'warning');
        const [a, b] = items;

        const cheaperKg = a.pricePerKg < b.pricePerKg ? 'a' : b.pricePerKg < a.pricePerKg ? 'b' : 'tie';
        const heavier = a.weight > b.weight ? 'a' : b.weight > a.weight ? 'b' : 'tie';
        const faster = a.pbbh > b.pbbh ? 'a' : b.pbbh > a.pbbh ? 'b' : 'tie';

        const rows = [
          ['Kandang & Kota', `${a.farmName} (${a.city})`, `${b.farmName} (${b.city})`, 'tie'],
          ['Jenis / Ras', `${a.species} ${a.breed}`, `${b.species} ${b.breed}`, 'tie'],
          ['Kelamin & Umur', `${a.sex} • ${a.ageLabel}`, `${b.sex} • ${b.ageLabel}`, 'tie'],
          ['Bobot Terkini', `${a.weight} kg`, `${b.weight} kg`, heavier],
          ['Pertumbuhan (PBBH)', `+${a.pbbh} kg/hari`, `+${b.pbbh} kg/hari`, faster],
          ['Harga Penawaran', Utils.formatRp(a.price), Utils.formatRp(b.price), 'tie'],
          ['Harga per Kg Hidup', `${Utils.formatRp(a.pricePerKg)}/kg`, `${Utils.formatRp(b.pricePerKg)}/kg`, cheaperKg],
          ['Bebas Residu Obat', a.withdrawalFree ? 'Ya (Aman)' : 'Masa Henti Obat', b.withdrawalFree ? 'Ya (Aman)' : 'Masa Henti Obat', 'tie'],
          ['Rekam Kesehatan', `${a.vaccineCount} catatan • ${a.verifiedRecords} timbang`, `${b.vaccineCount} catatan • ${b.verifiedRecords} timbang`, 'tie']
        ];

        UI.openModal({
          title: 'Bandingkan 2 Ternak',
          subtitle: 'Sorotan hijau menandakan angka bobot, pertumbuhan, atau harga/kg yang lebih unggul',
          maxWidth: 'max-w-2xl',
          bodyHTML: `
            <div class="space-y-4">
              <div class="grid grid-cols-2 gap-3">
                ${[a, b].map((it, idx) => `
                  <div class="rounded-3xl overflow-hidden glass-tile">
                    <div class="h-28 relative bg-[#EAE5DC]">
                      ${it.photo ? `<img src="${Utils.escapeHTML(it.photo)}" class="w-full h-full object-cover" />` : Utils.animalSVG(it.species, it.breed, `cmp_${idx}_${it.id}`)}
                      <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent"></div>
                      <div class="absolute bottom-2 left-3 right-3 text-white">
                        <div class="font-display text-base font-semibold leading-tight">${Utils.escapeHTML(it.name)}</div>
                        <div class="text-[10px] text-white/80">${it.animal_id} • ${it.weight} kg</div>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>

              <div class="rounded-2xl overflow-hidden border border-black/[0.07] bg-white/75 text-xs">
                ${rows.map(([label, valA, valB, win], i) => `
                  <div class="grid grid-cols-12 items-center ${i % 2 === 0 ? 'bg-white/60' : 'bg-[#FBF6E3]/35'} border-b border-black/[0.04] last:border-b-0">
                    <div class="col-span-4 px-3 py-2.5 font-medium text-[#6E7178]">${label}</div>
                    <div class="col-span-4 px-3 py-2.5 font-semibold ${win === 'a' ? 'text-[#1D6E42] bg-[#E7F6EC]/70' : 'text-[#2B2B2B]'}">${Utils.escapeHTML(valA)}</div>
                    <div class="col-span-4 px-3 py-2.5 font-semibold ${win === 'b' ? 'text-[#1D6E42] bg-[#E7F6EC]/70' : 'text-[#2B2B2B]'}">${Utils.escapeHTML(valB)}</div>
                  </div>
                `).join('')}
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <button type="button" id="cmp-wa-a" class="btn-touch rounded-full bg-[#1D6E42] hover:bg-[#165934] text-white text-xs font-semibold inline-flex items-center justify-center gap-1.5">
                  <i data-lucide="message-circle" class="w-4 h-4"></i> Chat Penjual ${Utils.escapeHTML(a.name)}
                </button>
                <button type="button" id="cmp-wa-b" class="btn-touch rounded-full bg-[#2B2B2B] hover:bg-black text-white text-xs font-semibold inline-flex items-center justify-center gap-1.5">
                  <i data-lucide="message-circle" class="w-4 h-4 text-[#F5D547]"></i> Chat Penjual ${Utils.escapeHTML(b.name)}
                </button>
              </div>
            </div>
          `,
          onMount: () => {
            document.getElementById('cmp-wa-a').onclick = () => {
              Utils.openWhatsApp(a.phone, `Halo ${a.farmName}, saya membandingkan ${a.name} (${a.animal_id}, ${a.weight} kg, ${Utils.formatRp(a.price)}) di Pasar TERMU dan tertarik menanyakan detailnya.`);
            };
            document.getElementById('cmp-wa-b').onclick = () => {
              Utils.openWhatsApp(b.phone, `Halo ${b.farmName}, saya membandingkan ${b.name} (${b.animal_id}, ${b.weight} kg, ${Utils.formatRp(b.price)}) di Pasar TERMU dan tertarik menanyakan detailnya.`);
            };
          }
        });
      },

      openMarketplacePassportModal(listingId) {
        const item = Marketplace.findById(listingId);
        if (!item) return;
        // Jika berasal dari kandang sendiri, pakai modal Paspor QR utama
        if (item.is_own_farm && (Store.data?.animals || []).some(a => a.id === item.animal_id)) {
          return this.openPassportQRModal(item.animal_id);
        }
        const base = `${location.origin && location.origin !== 'null' ? location.origin + location.pathname : 'https://termu.app/'}`;
        const url = `${base}#paspor=${encodeURIComponent(item.animal_id)}&mode=demo`;
        const qrSvg = Utils.generateQRSVG(url, 185);

        UI.openModal({
          title: `Paspor QR • ${item.name} (${item.animal_id})`,
          subtitle: `${item.farmName} (${item.city}) • data contoh`,
          maxWidth: 'max-w-sm',
          bodyHTML: `
            <div class="text-center space-y-4">
              <div class="flex items-center justify-center pt-1">${UI.brandLogo({ height: 24, color: '#2B2B2B' })}</div>
              <div class="inline-block p-3 rounded-3xl bg-white border border-black/10 shadow-sm">${qrSvg}</div>
              <div class="text-xs text-[#5A5D64]">
                <strong class="text-[#2B2B2B] block">${Utils.escapeHTML(item.farmName)}</strong>
                ${item.species} ${Utils.escapeHTML(item.breed)} • ${item.weight} kg • ${Utils.formatRp(item.pricePerKg)}/kg
              </div>
              <button type="button" id="mp-qr-open-pub" class="btn-touch w-full rounded-full bg-[#2B2B2B] text-white text-xs font-semibold">
                Buka Halaman Publik Paspor →
              </button>
            </div>
          `,
          onMount: (close) => {
            document.getElementById('mp-qr-open-pub').onclick = () => {
              close();
              this.publicPassportId = item.animal_id;
              this.publicPassportMode = 'demo';
              this.render();
            };
          }
        });
      },

      bindLoginEvents() {
        const backLp = document.getElementById('lg-back-landing');
        if (backLp) backLp.onclick = () => this.openSuperAppScreen('landing');
        const openMp = document.getElementById('lg-open-market');
        if (openMp) openMp.onclick = () => this.openSuperAppScreen('marketplace');

        const showErr = (msg) => {
          const box = document.getElementById('auth-error');
          if (!box) return;
          box.textContent = msg;
          box.classList.remove('hidden');
        };

        const bindPassToggle = (btnId, inputId) => {
          const btn = document.getElementById(btnId);
          const inp = document.getElementById(inputId);
          if (!btn || !inp) return;
          btn.onclick = () => {
            const isHidden = inp.type === 'password';
            inp.type = isHidden ? 'text' : 'password';
            btn.innerHTML = `<i data-lucide="${isHidden ? 'eye' : 'eye-off'}" class="w-4 h-4"></i>`;
            UI.refreshIcons();
          };
        };

        document.getElementById('tab-login').onclick = () => { this.loginTab = 'login'; this.render(); };
        document.getElementById('tab-register').onclick = () => { this.loginTab = 'register'; this.render(); };

        const switchLnk = document.getElementById('lnk-switch-auth');
        if (switchLnk) {
          switchLnk.onclick = () => {
            this.loginTab = this.loginTab === 'login' ? 'register' : 'login';
            this.render();
          };
        }

        const fillDemoBtn = document.getElementById('btn-fill-demo');
        if (fillDemoBtn) {
          fillDemoBtn.onclick = () => {
            const c = document.getElementById('lg-contact');
            const p = document.getElementById('lg-pass');
            if (c && p) {
              c.value = 'demo@termu.id';
              p.value = 'demo123';
              UI.toast('Kredensial Pemilik Demo diisi. Tekan Masuk.', 'info');
            }
          };
        }

        bindPassToggle('toggle-lg-pass', 'lg-pass');
        bindPassToggle('toggle-rg-pass', 'rg-pass');

        document.getElementById('btn-try-demo').onclick = async () => {
          await Auth.loginDemoOwner();
          this.appScreen = 'kandang';
          this.currentPage = 'beranda';
          UI.toast('Masuk sebagai Pak Sigit (Mode Demo • data contoh).', 'success');
          this.render();
        };

        document.getElementById('btn-start-scratch').onclick = () => {
          this.loginTab = 'register';
          this.render();
        };

        const lgForm = document.getElementById('form-login');
        if (lgForm) {
          lgForm.onsubmit = async (e) => {
            e.preventDefault();
            const contact = document.getElementById('lg-contact').value.trim();
            const pass = document.getElementById('lg-pass').value;
            const rem = document.getElementById('lg-remember').checked;
            if (!contact || pass.length < 6) return showErr('Isi email/WA dan kata sandi minimal 6 karakter.');
            const res = await Auth.login(contact, pass, rem);
            if (!res.ok) return showErr(res.error);
            this.appScreen = 'kandang';
            this.currentPage = 'beranda';
            UI.toast(`Selamat datang, ${res.user.name}!`, 'success');
            this.render();
          };
        }

        const rgForm = document.getElementById('form-register');
        if (rgForm) {
          rgForm.onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('rg-name').value.trim();
            const contact = document.getElementById('rg-contact').value.trim();
            const password = document.getElementById('rg-pass').value;
            const role = document.querySelector('input[name="rg-role"]:checked')?.value || 'pemilik';
            if (name.length < 2) return showErr('Nama lengkap minimal 2 karakter.');
            if (password.length < 6) return showErr('Kata sandi minimal 6 karakter.');
            const res = await Auth.register({ name, contact, password, role });
            if (!res.ok) return showErr(res.error);
            this.onboardingStep = 1;
            this.appScreen = 'kandang';
            this.currentPage = 'beranda';
            UI.toast('Akun berhasil dibuat di Mode Mulai dari Nol.', 'success');
            this.render();
          };
        }
      },

      /* -----------------------------------------------------------------------
         ONBOARDING 4 LANGKAH (MODE MULAI DARI NOL)
      ----------------------------------------------------------------------- */
      viewOnboarding() {
        const step = this.onboardingStep;
        const d = this.onboardingDraft;
        const pct = step * 25;

        return `

              ` : step === 2 ? `

                  ${['Sapi Potong', 'Kambing/Domba'].map(com => {
