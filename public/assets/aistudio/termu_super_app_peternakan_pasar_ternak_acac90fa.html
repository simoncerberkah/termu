                  </div>
                </div>
                <button type="submit" class="btn-touch w-full rounded-full bg-[#2B2B2B] text-white text-sm font-semibold">Simpan Bahan</button>
              </form>
            `,
            onMount: (close) => {
              document.getElementById('form-add-feed').onsubmit = (e) => {
                e.preventDefault();
                const name = document.getElementById('af-name').value.trim();
                if (!name) return;
                Store.data.feeds.push({
                  id: Utils.uid('fd'),
                  farm_id: Store.data.farm.id,
                  name,
                  price: Number(document.getElementById('af-price').value) || 0,
                  pk: Number(document.getElementById('af-pk').value) || 0,
                  tdn: Number(document.getElementById('af-tdn').value) || 0,
                  stock_kg: Number(document.getElementById('af-stock').value) || 0,
                  daily_use_kg: Number(document.getElementById('af-daily').value) || 0,
                  unit: 'kg'
                });
                Store.save();
                close();
                UI.toast(`Bahan pakan "${name}" ditambahkan.`, 'success');
                this.renderPageContent(); UI.refreshIcons();
              };
            }
          });
        };

        const addFeedBtn = document.getElementById('pk-add-feed') || document.getElementById('pk-add-feed-empty');
        if (addFeedBtn) addFeedBtn.onclick = openAddFeed;

        // Edit harga & stok inline di tab Bahan
        document.querySelectorAll('[data-feed-price]').forEach(inp => {
          inp.onchange = () => {
            const fd = (Store.data.feeds || []).find(f => f.id === inp.dataset.feedPrice);
            if (!fd) return;
            fd.price = Math.max(0, Number(inp.value) || 0);
            Store.save();
            UI.toast(`Harga ${fd.name} diperbarui jadi ${Utils.formatRp(fd.price)}/kg.`, 'info');
          };
        });
        document.querySelectorAll('[data-feed-stock]').forEach(inp => {
          inp.onchange = () => {
            const fd = (Store.data.feeds || []).find(f => f.id === inp.dataset.feedStock);
            if (!fd) return;
            fd.stock_kg = Math.max(0, Number(inp.value) || 0);
            Store.save();
            this.renderPageContent(); UI.refreshIcons();
          };
        });

        // Mixer Ransum A vs B
        document.querySelectorAll('[data-mx-slot]').forEach(inp => {
          inp.onchange = () => {
            const draft = this.ensureMixerDraft();
            draft[inp.dataset.mxSlot][inp.dataset.mxFid] = Math.max(0, Number(inp.value) || 0);
            this.renderPageContent(); UI.refreshIcons();
          };
        });
        const saveRat = document.getElementById('mx-save-rations');
        if (saveRat) {
          saveRat.onclick = () => {
            const draft = this.ensureMixerDraft();
            const toItems = (map) => Object.entries(map).filter(([, kg]) => kg > 0).map(([feed_id, kg]) => ({ feed_id, kg }));
            Store.data.rations = [
              { id: 'rat_a', name: draft.nameA, items: toItems(draft.A) },
              { id: 'rat_b', name: draft.nameB, items: toItems(draft.B) }
            ];
            Store.save();
            UI.toast('Formula A & B berhasil disimpan.', 'success');
          };
        }

        // Form catat pakan harian
        const flForm = document.getElementById('form-feed-log');
        if (flForm) {
          flForm.onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('fl-name').value.trim();
            const kg = Number(document.getElementById('fl-kg').value);
            const cost = Number(document.getElementById('fl-cost').value);
            if (!name || kg <= 0) return UI.toast('Isi nama ransum dan total kg.', 'warning');
            Store.data.feed_logs.unshift({
              id: Utils.uid('fl'),
              date: document.getElementById('fl-date').value || Utils.todayISO(),
              pen_id: document.getElementById('fl-pen').value,
              ration_name: name,
              total_kg: kg,
              cost: Math.max(0, cost || 0),
              recorded_by: Auth.session.name
            });
            Store.save();
            UI.toast('Pemberian pakan harian tercatat.', 'success');
            this.renderPageContent(); UI.refreshIcons();
          };
        }

        // Kalkulator Schoorl & HPP
        const bindSc = (id, key, isNum = true) => {
          const el = document.getElementById(id);
          if (!el) return;
          el.onchange = () => {
            this.schoorlState[key] = isNum ? (Number(el.value) || 0) : el.value;
            if (key === 'species') {
              this.schoorlState.chestCm = el.value === 'Sapi' ? 176 : 74;
              this.schoorlState.marketPricePerKg = el.value === 'Sapi' ? 62000 : 85000;
            }
            if (key === 'animalId' && el.value) {
              const an = (Store.data.animals || []).find(a => a.id === el.value);
              if (an && an.buy_price > 0) this.schoorlState.buyPrice = an.buy_price;
            }
            this.renderPageContent(); UI.refreshIcons();
          };
        };
        bindSc('sc-species', 'species', false);
        bindSc('sc-carcass', 'carcassPct', true);
        bindSc('sc-chest-range', 'chestCm', true);
        bindSc('sc-chest-num', 'chestCm', true);
        bindSc('sc-animal', 'animalId', false);
        bindSc('hpp-buy', 'buyPrice', true);
        bindSc('hpp-feed', 'feedCost', true);
        bindSc('hpp-med', 'medCost', true);
        bindSc('hpp-labor', 'laborCost', true);
        bindSc('hpp-mkt', 'marketPricePerKg', true);

        const saveScWt = document.getElementById('sc-save-wt');
        if (saveScWt) {
          saveScWt.onclick = () => {
            const aid = this.schoorlState.animalId;
            if (!aid) return UI.toast('Pilih ternak terlebih dahulu untuk menyimpan hasil ukur.', 'warning');
            const constAdd = this.schoorlState.species === 'Sapi' ? 22 : 18;
            const estKg = +(((Number(this.schoorlState.chestCm) + constAdd) ** 2) / 100).toFixed(1);
            Store.data.weights.push({
              id: Utils.uid('wt'),
              animal_id: aid,
              date: Utils.todayISO(),
              kg: estKg,
              method: 'Pita Ukur (Schoorl)'
            });
            Store.save();
            UI.toast(`Estimasi bobot ${estKg} kg disimpan ke riwayat ${aid}.`, 'success');
          };
        }
      },

      /* -----------------------------------------------------------------------
         6.7 HALAMAN KEUANGAN (KHUSUS PEMILIK: BUKU KAS, WAKTU JUAL TERBAIK, CSV/PDF)
      ----------------------------------------------------------------------- */
      viewKeuangan() {
        const d = Store.data;
        const txs = [...(d.transactions || [])].sort((a, b) => b.date.localeCompare(a.date));
        const totalIn = txs.filter(t => t.type === 'income').reduce((s, x) => s + (Number(x.amount) || 0), 0);
        const totalOut = txs.filter(t => t.type === 'expense').reduce((s, x) => s + (Number(x.amount) || 0), 0);
        const net = totalIn - totalOut;
        const filtered = txs.filter(t => this.financeFilterType === 'all' || t.type === this.financeFilterType);

        const active = Store.getActiveAnimals();
        if (!this.bestSellState.animalId && active.length) this.bestSellState.animalId = active[0].id;
        const bsAn = active.find(a => a.id === this.bestSellState.animalId) || active[0] || null;

        // Hitung proyeksi Waktu Jual Terbaik (0, 30, 60, 90 hari)
        const bsRows = [];
        if (bsAn) {
          const baseW = Store.getLatestWeight(bsAn);
          const pbbh = Store.getPBBH(bsAn.id) || (bsAn.species === 'Sapi' ? 0.85 : 0.11);
          const priceKg = Number(this.bestSellState.marketPricePerKg) || 62000;
          const feedDay = Number(this.bestSellState.dailyFeedCost) || 26000;
          const modalAwal = Number(bsAn.buy_price) || Math.round(baseW * priceKg * 0.72);
          [0, 30, 60, 90].forEach((days, idx) => {
            // Perlambatan wajar pada fase finishing
            const factor = [1, 0.96, 0.88, 0.78][idx];
            const estW = +(baseW + pbbh * days * factor).toFixed(1);
            const rev = Math.round(estW * priceKg);
            const addFeed = days * feedDay;
            const profit = rev - (modalAwal + addFeed);
            bsRows.push({ days, estW, rev, addFeed, profit });
          });
        }
        const bestRow = bsRows.length ? [...bsRows].sort((a, b) => b.profit - a.profit)[0] : null;

        return `
          <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4 mb-5">
            <div>
              <h1 class="font-display text-3xl font-normal text-[#2B2B2B]">Keuangan Peternakan</h1>
              <p class="text-xs text-[#6E7178] mt-1">Buku kas sederhana, analisis waktu jual terbaik, serta ekspor CSV & PDF${Store.mode === 'demo' ? ' • data contoh' : ''}</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button type="button" id="fn-exp-csv" class="btn-touch px-4 rounded-full glass-pill hover:bg-white text-xs font-semibold text-[#2B2B2B]">Ekspor CSV</button>
              <button type="button" id="fn-exp-pdf" class="btn-touch px-4 rounded-full glass-pill hover:bg-white text-xs font-semibold text-[#2B2B2B]">Cetak / PDF</button>
              <button type="button" id="fn-add-tx" class="btn-touch px-5 rounded-full bg-[#2B2B2B] text-white text-xs font-semibold inline-flex items-center gap-1.5">
                <i data-lucide="plus" class="w-4 h-4 text-[#F5D547]"></i> Catat Kas
              </button>
            </div>
          </div>

          <!-- Header Cetak PDF -->
          <div class="hidden print:flex items-center justify-between pb-4 mb-4 border-b border-black/15">
            ${UI.brandLogo({ height: 26, color: '#2B2B2B' })}
            <div class="text-right text-xs">
              <strong>Laporan Keuangan • ${Utils.escapeHTML(d.farm.name)}</strong>
              <div>Dicetak ${Utils.formatDateID(Utils.todayISO())}</div>
            </div>
          </div>

          <!-- 3 Ringkasan Arus Kas -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-5">
            <div class="bento-card p-5">
              <div class="text-xs text-[#6E7178]">Total Pemasukan</div>
              <div class="font-metric text-3xl text-[#1D6E42] mt-1">${Utils.formatRp(totalIn)}</div>
            </div>
            <div class="bento-card p-5">
              <div class="text-xs text-[#6E7178]">Total Pengeluaran</div>
              <div class="font-metric text-3xl text-[#9E2420] mt-1">${Utils.formatRp(totalOut)}</div>
            </div>
            <div class="bento-card p-5">
              <div class="text-xs text-[#6E7178]">Arus Kas Bersih</div>
              <div class="font-metric text-3xl ${net >= 0 ? 'text-[#2B2B2B]' : 'text-[#9E2420]'} mt-1">${Utils.formatRp(net)}</div>
            </div>
          </div>

          <!-- Tab Buku Kas vs Waktu Jual Terbaik -->
          <div class="flex items-center gap-1 p-1.5 rounded-full glass-pill inline-flex mb-5 no-print">
            <button type="button" data-fn-tab="kas" class="h-9 px-4 rounded-full text-xs font-semibold ${this.financeTab === 'kas' ? 'bg-[#2B2B2B] text-white' : 'text-[#5A5D64]'}">Buku Kas (${txs.length})</button>
            <button type="button" data-fn-tab="sell" class="h-9 px-4 rounded-full text-xs font-semibold ${this.financeTab === 'sell' ? 'bg-[#2B2B2B] text-white' : 'text-[#5A5D64]'}">Waktu Jual Terbaik</button>
          </div>

          ${this.financeTab === 'kas' ? `
            <div class="bento-card p-5 space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2 no-print">
                <h2 class="text-base font-semibold text-[#2B2B2B]">Riwayat Transaksi</h2>
                <select id="fn-filter-type" class="h-10 px-3.5 rounded-full glass-tile text-xs">
                  <option value="all" ${this.financeFilterType === 'all' ? 'selected' : ''}>Semua Transaksi</option>
                  <option value="income" ${this.financeFilterType === 'income' ? 'selected' : ''}>Pemasukan Saja</option>
                  <option value="expense" ${this.financeFilterType === 'expense' ? 'selected' : ''}>Pengeluaran Saja</option>
                </select>
              </div>
              <div class="space-y-2">
                ${filtered.length ? filtered.map(t => `
                  <div class="p-3.5 rounded-2xl glass-tile flex items-center justify-between gap-3 text-xs">
                    <div class="min-w-0">
                      <div class="font-semibold text-[#2B2B2B]">${Utils.escapeHTML(t.category)}</div>
                      <div class="text-[#6E7178] truncate">${Utils.formatDateID(t.date)} • ${Utils.escapeHTML(t.note || '-')}</div>
                    </div>
                    <div class="font-bold shrink-0 ${t.type === 'income' ? 'text-[#1D6E42]' : 'text-[#9E2420]'}">
                      ${t.type === 'income' ? '+' : '-'}${Utils.formatRp(t.amount)}
                    </div>
                  </div>
                `).join('') : `<p class="text-xs text-[#6E7178] text-center py-8">Belum ada transaksi tercatat.</p>`}
              </div>
            </div>
          ` : `
            <div class="bento-card p-5 space-y-4">
              <h2 class="text-base font-semibold text-[#2B2B2B]">Simulasi Waktu Jual Terbaik</h2>
              ${bsAn ? `
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                  <div>
                    <label class="block text-[#5A5D64] mb-1">Pilih Ternak</label>
                    <select id="bs-an" class="w-full h-11 px-3 rounded-2xl bg-white border border-black/10">
                      ${active.map(a => `<option value="${a.id}" ${a.id === bsAn.id ? 'selected' : ''}>${a.id} — ${Utils.escapeHTML(a.name)} (${Store.getLatestWeight(a)} kg)</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-[#5A5D64] mb-1">Harga Pasar (Rp/kg hidup)</label>
                    <input type="number" id="bs-price" value="${this.bestSellState.marketPricePerKg}" class="w-full h-11 px-3 rounded-2xl bg-white border border-black/10 font-semibold" />
                  </div>
                  <div>
                    <label class="block text-[#5A5D64] mb-1">Biaya Pakan (Rp/ekor/hari)</label>
                    <input type="number" id="bs-feed" value="${this.bestSellState.dailyFeedCost}" class="w-full h-11 px-3 rounded-2xl bg-white border border-black/10 font-semibold" />
                  </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                  ${bsRows.map(r => {
                    const isBest = bestRow && bestRow.days === r.days;
                    return `
                      <div class="p-4 rounded-2xl ${isBest ? 'bg-[#2B2B2B] text-white' : 'glass-tile text-[#2B2B2B]'} space-y-1.5 text-xs">
                        <div class="flex items-center justify-between">
                          <strong>${r.days === 0 ? 'Jual Sekarang' : `+${r.days} Hari`}</strong>
                          ${isBest ? `<span class="px-2 py-0.5 rounded-full bg-[#F5D547] text-[#2B2B2B] text-[10px] font-bold">Optimal</span>` : ''}
                        </div>
                        <div class="${isBest ? 'text-white/75' : 'text-[#6E7178]'}">Bobot: <strong>${r.estW} kg</strong></div>
                        <div class="${isBest ? 'text-white/75' : 'text-[#6E7178]'}">Tambahan Pakan: ${Utils.formatRpCompact(r.addFeed)}</div>

          csvBtn.onclick = () => {
            const rows = [['Tanggal', 'Jenis', 'Kategori', 'Jumlah', 'Catatan']];
            (Store.data.transactions || []).forEach(t => {
              rows.push([t.date, t.type === 'income' ? 'Pemasukan' : 'Pengeluaran', t.category, t.amount, (t.note || '').replace(/,/g, ';')]);
            });
            const csv = rows.map(r => r.join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

      bindPengaturanEvents() {
        const form = document.getElementById('form-settings-farm');
        if (form) {
          form.onsubmit = (e) => {
            e.preventDefault();
            Store.data.farm.name = document.getElementById('st-name').value.trim() || Store.data.farm.name;
            Store.data.farm.location = document.getElementById('st-loc').value.trim();
            Store.data.farm.phone = document.getElementById('st-phone').value.trim();
            Store.data.farm.daily_feed_budget = Math.max(10000, Number(document.getElementById('st-budget').value) || 500000);
            Store.data.farm.gemini_api_key = document.getElementById('st-apikey').value.trim();
            Store.save();
            UI.toast('Pengaturan peternakan disimpan.', 'success');
          };
        }

        const addW = document.getElementById('st-add-worker');
        if (addW) {
          addW.onclick = () => {
            UI.openModal({
              title: 'Tambah Akun Pekerja Kandang',
              subtitle: 'Pekerja hanya mengakses input harian (tanpa buku kas & pengaturan)',
              maxWidth: 'max-w-sm',
              bodyHTML: `
                <form id="form-add-wk" class="space-y-3">
                  <input type="text" id="wk-name" placeholder="Nama pekerja (mis. Ahmad)" class="w-full h-11 px-3.5 rounded-2xl bg-white border border-black/10 text-sm" required />
                  <input type="text" id="wk-contact" placeholder="Email atau nomor WA pekerja" class="w-full h-11 px-3.5 rounded-2xl bg-white border border-black/10 text-sm" required />
                  <input type="password" id="wk-pass" minlength="6" placeholder="Kata sandi awal (min 6 karakter)" class="w-full h-11 px-3.5 rounded-2xl bg-white border border-black/10 text-sm" required />
                  <button type="submit" class="btn-touch w-full rounded-full bg-[#2B2B2B] text-white text-sm font-semibold">Buat Akun Pekerja</button>
                </form>
              `,
              onMount: (close) => {
                document.getElementById('form-add-wk').onsubmit = async (e) => {
                  e.preventDefault();
                  const name = document.getElementById('wk-name').value.trim();
                  const contact = document.getElementById('wk-contact').value.trim();
                  const pass = document.getElementById('wk-pass').value;
                  if (!name || !contact || pass.length < 6) return;
                  const hash = await Utils.sha256(pass);
                  Store.data.users.push({ id: Utils.uid('usr'), name, contact, passwordHash: hash, role: 'pekerja', createdAt: Utils.todayISO() });
                  Store.save(); close();
                  UI.toast(`Akun pekerja ${name} berhasil dibuat.`, 'success');
                  this.renderPageContent(); UI.refreshIcons();
                };
              }
            });
          };
        }

        const expBtn = document.getElementById('st-exp-json');
        if (expBtn) {
          expBtn.onclick = () => {
            const blob = new Blob([JSON.stringify(Store.data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `TERMU-Backup-${Store.mode}-${Utils.todayISO()}.json`;
            a.click();
            UI.toast('Backup JSON berhasil diunduh.', 'success');
          };
        }

        const impInp = document.getElementById('st-imp-json');
        if (impInp) {
          impInp.onchange = (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
              try {
                const parsed = JSON.parse(reader.result);
                if (!parsed || !parsed.farm || !Array.isArray(parsed.animals)) throw new Error('Struktur JSON tidak sesuai.');
                Store.data = parsed;
                Store.save();
                UI.toast('Data JSON berhasil diimpor!', 'success');
                this.render();
              } catch (err) {
                UI.toast('File JSON tidak valid.', 'error');
              }
            };
            reader.readAsText(file);
          };
        }

        const goLp = document.getElementById('st-go-landing');
        if (goLp) goLp.onclick = () => this.openSuperAppScreen('landing');
      },

      async sendAIChatMessage(question) {
        const clean = (question || '').trim();
        if (!clean || this.aiChatLoading) return;
        this.ensureAIChatWelcome();

        const historyBefore = [...this.aiChatMessages];
        this.aiChatMessages.push({
          id: Utils.uid('msg'),
          role: 'user',
          text: clean,
          time: Utils.nowTimeStr()
        });
        this.aiChatLoading = true;
        this.render();
        this.scrollAIChatThreads();

        try {
          const reply = await AIChatAssistant.ask(clean, historyBefore);
          if (reply) {
            this.aiChatMessages.push({
              id: Utils.uid('msg'),
              role: 'ai',
              text: reply.text,
              source: reply.source,
              time: Utils.nowTimeStr()
            });
          }
        } catch (err) {
          this.aiChatMessages.push({
            id: Utils.uid('msg'),
            role: 'ai',
            text: AIChatAssistant.localFallbackAnswer(clean),
            source: 'Analisis Lokal',
            time: Utils.nowTimeStr()
          });
        } finally {
          this.aiChatLoading = false;
          this.render();
          this.scrollAIChatThreads();
        }
      },

      scrollAIChatThreads() {
        ['ai-page-thread', 'ai-float-thread'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.scrollTop = el.scrollHeight;
        });
      },

      bindFloatingAIChatEvents() {
        const toggle = document.getElementById('ai-fab-toggle');
        if (toggle) {
          toggle.onclick = () => {
            this.aiChatOpen = !this.aiChatOpen;
            this.render();
            if (this.aiChatOpen) this.scrollAIChatThreads();
          };
        }
        const closeBtn = document.getElementById('ai-float-close');
        if (closeBtn) {
          closeBtn.onclick = () => {
            this.aiChatOpen = false;
            this.render();
          };
        }
        const expandBtn = document.getElementById('ai-float-expand');
        if (expandBtn) {
          expandBtn.onclick = () => {
            this.aiChatOpen = false;
            this.navigate('ai');
          };
        }
        const fForm = document.getElementById('ai-float-form');
        if (fForm) {
          fForm.onsubmit = (e) => {
            e.preventDefault();
            const inp = document.getElementById('ai-float-input');
            const val = inp?.value || '';
            if (inp) inp.value = '';
            this.sendAIChatMessage(val);
          };
        }
        if (this.aiChatOpen) {
          document.querySelectorAll('[data-ai-prompt]').forEach(btn => {
            btn.onclick = () => this.sendAIChatMessage(btn.dataset.aiPrompt);
          });
        }
      },

      bindAIChatEvents() {

      openWhatsAppReportModal() {
        const d = Store.data;
        const active = Store.getActiveAnimals();
        const today = Utils.todayISO();
        const weekAgo = Utils.daysAgoISO(7);

        const buildText = (period) => {
          const isWeekly = period === 'mingguan';
          const feedLogs = (d.feed_logs || []).filter(l => isWeekly ? l.date >= weekAgo : l.date === today);
          const feedSum = feedLogs.reduce((s, x) => s + (Number(x.cost) || 0), 0);
          const tasksToday = (d.tasks || []).filter(t => t.date === today);
          const undone = tasksToday.filter(t => !t.done);
          const upcoming = (d.schedules || []).filter(s => !s.done && s.date >= today && s.date <= Utils.daysFromNowISO(7));
          const suggestions = DecisionEngine.getSuggestions();

          return [
            `*RINGKASAN ${isWeekly ? 'MINGGU INI' : 'HARI INI'} — TERMU*${Store.mode === 'demo' ? ' (DATA CONTOH)' : ''}`,
            `Peternakan: ${d.farm.name}`,
            `Periode: ${isWeekly ? `${Utils.formatDateID(weekAgo)} s/d ${Utils.formatDateID(today)}` : Utils.formatDateID(today)}`,
            ``,
            `• Populasi aktif: ${active.length} ekor`,
            `• Biaya pakan ${isWeekly ? '7 hari terakhir' : 'hari ini'}: ${Utils.formatRp(feedSum)}`,
            `• Tugas harian selesai: ${tasksToday.length - undone.length}/${tasksToday.length}`,
            undone.length ? `• Belum selesai: ${undone.slice(0, 3).map(x => x.item).join(', ')}` : `• Semua tugas hari ini sudah beres.`,
            isWeekly && upcoming.length ? `• Jadwal 7 hari ke depan: ${upcoming.slice(0, 3).map(s => `${s.title} (${Utils.formatShortDate(s.date)})`).join('; ')}` : '',
            suggestions.length ? `• Perhatian penting: ${suggestions[0].title} (${suggestions[0].reason})` : `• Tidak ada peringatan mendesak.`
          ].filter(Boolean).join('\n');
        };

        UI.openModal({
          title: 'Laporan Ringkasan ke WhatsApp',
          subtitle: 'Pilih periode harian atau mingguan, lalu kirim via wa.me',
          maxWidth: 'max-w-md',
          bodyHTML: `
            <div class="space-y-4">
              <div class="grid grid-cols-2 p-1 rounded-full bg-black/5">
                <button type="button" id="wa-tab-day" class="h-9 rounded-full text-xs font-semibold ${this.waReportPeriod === 'harian' ? 'bg-[#2B2B2B] text-white' : 'text-[#5A5D64]'}">Hari Ini</button>
                <button type="button" id="wa-tab-week" class="h-9 rounded-full text-xs font-semibold ${this.waReportPeriod === 'mingguan' ? 'bg-[#2B2B2B] text-white' : 'text-[#5A5D64]'}">Minggu Ini</button>
              </div>
              <textarea id="wa-report-txt" rows="10" class="w-full p-3.5 rounded-2xl bg-white border border-black/10 text-xs leading-relaxed font-mono">${Utils.escapeHTML(buildText(this.waReportPeriod))}</textarea>
              <div class="flex gap-2.5">
                <button type="button" id="wa-copy-btn" class="btn-touch px-4 rounded-full bg-white border border-black/15 text-xs font-semibold text-[#2B2B2B]">Salin Teks</button>
                <button type="button" id="wa-send-btn" class="btn-touch flex-1 rounded-full bg-[#1D6E42] hover:bg-[#165934] text-white text-xs font-semibold inline-flex items-center justify-center gap-1.5">
                  <i data-lucide="message-circle" class="w-4 h-4"></i> Kirim via WhatsApp

              ` : ''}
              <button type="button" id="qa-wa" class="btn-touch p-4 rounded-2xl bg-[#FBF6E3] border border-[#F5D547] text-left">
                <div class="font-semibold text-xs text-[#2B2B2B]">Laporan WA</div>
                <div class="text-[10px] text-[#5A5D64] mt-0.5">Harian / mingguan</div>
              </button>
            </div>
          `,
          onMount: (close) => {
            document.getElementById('qa-animal').onclick = () => { close(); this.openAddAnimalModal(); };
            document.getElementById('qa-weight').onclick = () => { close(); this.openRecordWeightModal(); };
            document.getElementById('qa-feed').onclick = () => { close(); this.openQuickFeedLogModal(); };
            document.getElementById('qa-health').onclick = () => { close(); this.navigate('kesehatan'); };
            const tx = document.getElementById('qa-tx');
            if (tx) tx.onclick = () => { close(); this.openAddTransactionModal(); };
            document.getElementById('qa-wa').onclick = () => { close(); this.openWhatsAppReportModal(); };
          }
        });
      },

      openProfileModal() {
        const isDemo = Store.mode === 'demo';
        UI.openModal({
          title: Auth.session.name,
          subtitle: `${Auth.session.contact} • Peran: ${Auth.session.role.toUpperCase()}`,
          maxWidth: 'max-w-sm',
          bodyHTML: `
            <div class="space-y-3">
              <div class="p-3.5 rounded-2xl bg-white border border-black/10 text-xs flex items-center justify-between gap-2">
                <div>
                  <div class="text-[#8E9096]">Mode Aktif Saat Ini</div>
                  <div class="font-bold text-[#2B2B2B] mt-0.5">${isDemo ? 'MODE DEMO (data contoh terpisah)' : 'MODE LIVE (data peternakan Anda)'}</div>
                </div>
                <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${PWA.isOffline ? 'bg-[#FFF0D6] text-[#8F4B05]' : 'bg-[#E7F6EC] text-[#1D6E42]'}">${PWA.isOffline ? 'Offline' : 'Online'}</span>
              </div>

              ${Auth.isOwner() ? `
                <button type="button" id="pr-settings" class="btn-touch w-full rounded-full bg-[#2B2B2B] text-white text-xs font-semibold">
                  Buka Pengaturan Peternakan
                </button>
              ` : ''}

              <button type="button" id="pr-landing" class="btn-touch w-full rounded-full bg-white border border-black/15 text-[#2B2B2B] text-xs font-semibold">
                Beranda Super App TERMU
              </button>

              <button type="button" id="pr-switch-mode" class="btn-touch w-full rounded-full bg-[#FBF6E3] hover:bg-[#F5D547] text-[#2B2B2B] text-xs font-semibold">
                ${isDemo ? 'Pindah ke Mode Mulai dari Nol (Live)' : 'Coba Mode Demo (Data Contoh)'}
              </button>

              ${isDemo ? `
                <button type="button" id="pr-reset-demo" class="btn-touch w-full rounded-full bg-white border border-black/15 text-xs font-semibold text-[#2B2B2B]">
                  Reset Data Demo ke Awal
                </button>
              ` : ''}

              <button type="button" id="pr-logout" class="btn-touch w-full rounded-full bg-[#FDECEC] hover:bg-[#FAD6D5] text-[#9E2420] text-xs font-semibold">
                Keluar dari Akun
              </button>
            </div>
          `,
          onMount: (close) => {
            const setBtn = document.getElementById('pr-settings');
            if (setBtn) setBtn.onclick = () => { close(); this.navigate('pengaturan'); };

            const lpBtn = document.getElementById('pr-landing');
            if (lpBtn) lpBtn.onclick = () => { close(); this.openSuperAppScreen('landing'); };

            document.getElementById('pr-switch-mode').onclick = async () => {
              close();
              if (isDemo) {
                Auth.logout();
                this.appScreen = 'login';
                this.loginTab = 'register';
                UI.toast('Silakan masuk/daftar untuk memakai Mode Mulai dari Nol.', 'info');
                this.render();
              } else {
                await Auth.loginDemoOwner();
                this.appScreen = 'kandang';
                this.currentPage = 'beranda';
                UI.toast('Beralih ke Mode Demo (data Live Anda tetap aman).', 'success');
                this.render();
              }
            };
            const rst = document.getElementById('pr-reset-demo');
            if (rst) {
              rst.onclick = async () => {
                close();
                await Store.resetDemo();
                this.mixerDraft = null;
                UI.toast('Data demo dikembalikan ke kondisi awal.', 'success');
                this.render();
              };
            }
            document.getElementById('pr-logout').onclick = () => {
              close();
              Auth.logout();
              this.appScreen = 'landing';
              this.loginTab = 'login';
              UI.toast('Anda telah keluar.', 'info');
              this.render();
            };
          }
        });
      },

      openQuickAnimalSummary(animalId) {
        this.selectedAnimalId = animalId;
        this.navigate('ternak');
      },

      openQuickAddAnimalModal() {
        this.openAddAnimalModal();
      }
    };

    // Inisialisasi aplikasi saat DOM siap
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => App.init());
    } else {
      App.init();
    }
  })();
  </script>
</body>
</html>
