                    return `
                      <button type="button" data-ob-com="${com}" class="btn-touch p-4 rounded-3xl border text-left transition ${checked ? 'bg-[#2B2B2B] text-white border-[#2B2B2B]' : 'bg-white text-[#2B2B2B] border-black/10'}">

              ` : step === 3 ? `

                <p class="text-xs text-[#7E8188] mt-1 mb-5">Sekat memudahkan pencatatan pakan dan checklist harian pekerja.</p>

                  <div>
                    <label class="block text-xs font-medium text-[#5A5D64] mb-1">Kapasitas (ekor)</label>
                    <input type="number" id="ob-pen-cap" value="${d.penCap}" min="1" class="w-full h-11 px-4 rounded-2xl bg-white border border-black/10 text-sm" />
                  </div>
                </div>
              ` : `
                <h1 class="font-display text-2xl font-medium text-[#2B2B2B]">Tambah Ternak Pertama (Opsional)</h1>
                <p class="text-xs text-[#7E8188] mt-1 mb-5">Anda bisa langsung mengisi 1 ekor sekarang atau melewatinya ke Dashboard.</p>
                <div class="space-y-3">
                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-medium text-[#5A5D64] mb-1">ID Ternak</label>
                      <input type="text" id="ob-an-id" value="SP-001" class="w-full h-11 px-3.5 rounded-2xl bg-white border border-black/10 text-sm" />

                    <div>

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-medium text-[#5A5D64] mb-1">Jenis</label>

                      <label class="block text-xs font-medium text-[#5A5D64] mb-1">Bobot Masuk (kg)</label>

                    </div>
                  </div>
                </div>
              `}

              <div class="flex items-center justify-between gap-3 mt-7">
                ${step > 1 ? `<button type="button" id="ob-prev" class="btn-touch px-5 rounded-full bg-white border border-black/10 text-xs font-semibold text-[#2B2B2B]">Kembali</button>` : '<div></div>'}
                <button type="button" id="ob-next" class="btn-touch px-6 rounded-full bg-[#2B2B2B] hover:bg-black text-white text-xs font-semibold">
                  ${step < 4 ? 'Lanjut' : 'Selesai & Buka Dashboard'}
                </button>
              </div>
            </div>
          </div>
        `;

      bindOnboardingEvents() {
        const finishOnboarding = () => {
          Store.data.farm.onboarding_done = true;
          Store.save();
          this.render();
        };

        document.getElementById('ob-skip-all').onclick = finishOnboarding;

        document.querySelectorAll('[data-ob-com]').forEach(btn => {
          btn.onclick = () => {
            const com = btn.dataset.obCom;
            const list = this.onboardingDraft.commodities;
            if (list.includes(com)) {
              if (list.length > 1) this.onboardingDraft.commodities = list.filter(x => x !== com);
            } else {
              list.push(com);
            }
            this.render();
          };
        });

        const prev = document.getElementById('ob-prev');
        if (prev) prev.onclick = () => { this.onboardingStep = Math.max(1, this.onboardingStep - 1); this.render(); };

        document.getElementById('ob-next').onclick = () => {
          const step = this.onboardingStep;
          if (step === 1) {
            const nm = document.getElementById('ob-farm-name').value.trim();
            if (!nm) return UI.toast('Isi nama peternakan Anda terlebih dahulu.', 'warning');
            this.onboardingDraft.name = nm;
            this.onboardingDraft.location = document.getElementById('ob-farm-loc').value.trim();
            this.onboardingDraft.phone = document.getElementById('ob-farm-phone').value.trim();
            Store.data.farm.name = nm;
            Store.data.farm.location = this.onboardingDraft.location;
            Store.data.farm.phone = this.onboardingDraft.phone;
            Store.save();
            this.onboardingStep = 2;
            this.render();
          } else if (step === 2) {
            Store.data.farm.commodities = [...this.onboardingDraft.commodities];
            Store.save();
            this.onboardingStep = 3;
            this.render();
          } else if (step === 3) {
            const code = document.getElementById('ob-pen-code').value.trim().toUpperCase() || 'A1';
            const name = document.getElementById('ob-pen-name').value.trim() || `Sekat ${code}`;
            const cap = Number(document.getElementById('ob-pen-cap').value) || 10;
            this.onboardingDraft.penCode = code;
            this.onboardingDraft.penName = name;
            this.onboardingDraft.penCap = cap;
            if (Store.data.pens.length === 0) {
              Store.data.pens.push({
                id: Utils.uid('pen'), farm_id: Store.data.farm.id,
                code, name, capacity: cap, cleanliness: 'Bersih', water_status: 'Cukup', notes: ''
              });
              Store.save();
            }
            this.onboardingStep = 4;
            this.render();
          } else {
            const anName = document.getElementById('ob-an-name').value.trim();
            const anWt = Number(document.getElementById('ob-an-wt').value);
            if (anName && anWt > 0) {
              const id = document.getElementById('ob-an-id').value.trim().toUpperCase() || 'SP-001';
              const sp = document.getElementById('ob-an-sp').value;
              const today = Utils.todayISO();
              Store.data.animals.push({
                id, farm_id: Store.data.farm.id, name: anName, species: sp,
                breed: sp === 'Sapi' ? 'Lokal / Cross' : 'Lokal', sex: 'Jantan', birth: '',
                origin: 'Input awal', entry_weight: anWt, entry_date: today,
                pen_id: Store.data.pens[0]?.id || '', status: 'sehat',
                buy_price: 0, ready_for_sale: false, photo: '', notes: ''
              });
              Store.data.weights.push({ id: Utils.uid('wt'), animal_id: id, date: today, kg: anWt, method: 'Bobot Awal' });
            }
            UI.toast('Peternakan Anda siap digunakan!', 'success');
            finishOnboarding();
          }
        };
      },

      /* -----------------------------------------------------------------------
         6.1 HALAMAN BERANDA (DASHBOARD BENTO SESUAI REFERENSI VISUAL)
      ----------------------------------------------------------------------- */
      viewDashboard() {
        const d = Store.data;
        const today = Utils.todayISO();
        const active = Store.getActiveAnimals();
        const totalActive = active.length;
        const attentionCount = active.filter(a => a.status === 'perhatian' || Store.getActiveWithdrawal(a.id)).length;
        const healthyCount = Math.max(0, totalActive - attentionCount);

        // Progress pills horizontal
        const tasksToday = (d.tasks || []).filter(t => t.date === today);
        const tasksDone = tasksToday.filter(t => t.done).length;
        const taskPct = tasksToday.length ? Math.round((tasksDone / tasksToday.length) * 100) : 0;

        const feeds = d.feeds || [];
        const safeFeeds = feeds.filter(f => !f.daily_use_kg || (f.stock_kg / f.daily_use_kg) > 5).length;
        const feedStockPct = feeds.length ? Math.round((safeFeeds / feeds.length) * 100) : 0;

        const scheds = d.schedules || [];
        const schedDone = scheds.filter(s => s.done).length;
        const schedPct = scheds.length ? Math.round((schedDone / scheds.length) * 100) : 0;

        const healthyPct = totalActive ? Math.round((healthyCount / totalActive) * 100) : 0;

        // Kartu sorotan ternak unggulan (seperti kartu foto Lora Piterson di referensi)
        const featured = [...active].sort((a, b) => Store.getLatestWeight(b) - Store.getLatestWeight(a))[0] || null;
        const featuredWeight = featured ? Store.getLatestWeight(featured) : 0;
        const featuredPbbh = featured ? Store.getPBBH(featured.id) : null;

        // Data grafik bar mingguan (Bobot rata-rata sapi/ternak aktif per minggu terakhir)
        const cows = active.filter(a => a.species === 'Sapi');
        const sampleGroup = cows.length ? cows : active;
        const avgLatest = sampleGroup.length
          ? Math.round(sampleGroup.reduce((s, a) => s + Store.getLatestWeight(a), 0) / sampleGroup.length)
          : 0;
        const weekLabels = ['M-6', 'M-5', 'M-4', 'M-3', 'M-2', 'M-1', 'Kini'];
        const weeklyBars = weekLabels.map((lbl, idx) => {
          if (!avgLatest) return { label: lbl, val: 0, pct: 12, isToday: idx === 6 };
          const stepDrop = (6 - idx) * (cows.length ? 6 : 1.5);
          const val = Math.max(10, Math.round(avgLatest - stepDrop));
          return { label: lbl, val, isToday: idx === 6 };
        });
        const maxBar = Math.max(1, ...weeklyBars.map(b => b.val));
        weeklyBars.forEach(b => {
          b.pct = avgLatest ? Math.max(22, Math.round((b.val / maxBar) * 100)) : 14;
        });

        // Cincin progress Biaya Pakan Hari Ini terhadap anggaran harian
        const feedLogsToday = (d.feed_logs || []).filter(l => l.date === today);
        const feedCostToday = feedLogsToday.reduce((s, x) => s + (Number(x.cost) || 0), 0);
        const dailyBudget = Math.max(1, Number(d.farm.daily_feed_budget) || 500000);
        const budgetRatio = Math.min(1, feedCostToday / dailyBudget);
        const budgetPct = Math.round((feedCostToday / dailyBudget) * 100);
        const ringR = 56;
        const ringC = 2 * Math.PI * ringR;
        const ringOffset = ringC * (1 - budgetRatio);

        // Saran Asisten Keputusan (accordion)
        const suggestions = DecisionEngine.getSuggestions();

        // Kalender mingguan (6 hari mulai kemarin s/d +4 hari)
        const calDays = [-1, 0, 1, 2, 3, 4].map(offset => {
          const iso = offset < 0 ? Utils.daysAgoISO(Math.abs(offset)) : Utils.daysFromNowISO(offset);
          const dt = new Date(iso + 'T00:00:00');
          const dayNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
          const dayScheds = scheds.filter(s => s.date === iso);
          return {
            iso,
            dayName: dayNames[dt.getDay()],
            dayNum: dt.getDate(),
            isToday: iso === today,
            items: dayScheds
          };
        });

        // Checklist "Mulai dari sini" untuk Mode Live kosong
        const isEmptyMode = Store.mode === 'live' && totalActive === 0;
        const startSteps = [
          { label: 'Lengkapi profil peternakan', done: Boolean(d.farm.name && d.farm.name !== 'Peternakan Saya'), action: () => `data-start-step="pengaturan"` },
          { label: 'Buat minimal 1 sekat kandang', done: (d.pens || []).length > 0, action: () => `data-start-step="sekat"` },
          { label: 'Tambah ternak pertama Anda', done: totalActive > 0, action: () => `data-start-step="ternak"` },
          { label: 'Tambahkan bahan pakan & harga', done: feeds.length > 0, action: () => `data-start-step="pakan"` }
        ];
        const allStartDone = startSteps.every(s => s.done);

        return `
          <!-- Header Sapaan & 3 Angka Besar Tipis (Rapi & Sejajar dengan Liquid Glass) -->
          <section class="flex flex-col lg:flex-row lg:items-end justify-between gap-5 mb-6">
            <div>
              <p class="text-xs font-semibold text-[#6E7178] flex flex-wrap items-center gap-2">
                <span>${Utils.escapeHTML(d.farm.name)}</span>
                ${d.farm.location ? `<span>• ${Utils.escapeHTML(d.farm.location)}</span>` : ''}
                ${Store.mode === 'demo' ? `<span class="px-2.5 py-0.5 rounded-full glass-pill text-[#2B2B2B] text-[10px]">data contoh</span>` : ''}
              </p>
              <h1 class="font-display text-3xl sm:text-4xl font-normal text-[#2B2B2B] mt-1.5 tracking-tight">
                ${Utils.greeting()}, ${Utils.escapeHTML(Auth.session.name)}
              </h1>
            </div>

            <!-- 3 Angka Metrik Besar Tipis dalam Kapsul Kaca Ringkas -->
            <div class="grid grid-cols-3 gap-2.5 sm:gap-3.5">
              <button type="button" data-nav="ternak" class="glass-pill rounded-[24px] px-4 py-3 text-left group hover:bg-white/95 transition">

      bindDashboardEvents() {
        const featBtn = document.getElementById('dash-open-feat');
        if (featBtn) {
          featBtn.onclick = () => {
            this.selectedAnimalId = featBtn.dataset.featId;
            this.navigate('ternak');
          };
        }
        const emptyAdd = document.getElementById('dash-empty-add-an');
        if (emptyAdd) emptyAdd.onclick = () => this.openAddAnimalModal();

        const qWt = document.getElementById('dash-quick-wt');
        if (qWt) qWt.onclick = () => this.openRecordWeightModal();

        const qFeed = document.getElementById('dash-log-feed');
        if (qFeed) qFeed.onclick = () => this.openQuickFeedLogModal();

        const waBtn = document.getElementById('dash-wa-btn');
        if (waBtn) waBtn.onclick = () => this.openWhatsAppReportModal();

        // Checklist tugas hari ini
        document.querySelectorAll('[data-dash-task]').forEach(btn => {
          btn.onclick = () => {
            const t = (Store.data.tasks || []).find(x => x.id === btn.dataset.dashTask);
            if (!t) return;
            t.done = !t.done;
            t.done_by = t.done ? Auth.session.name : '';
            t.done_at = t.done ? Utils.nowTimeStr() : '';
            Store.save();
            this.renderPageContent();
            UI.refreshIcons();
          };
        });

        // Accordion Saran Hari Ini
        document.querySelectorAll('[data-acc-idx]').forEach(btn => {
          btn.onclick = () => {
            const idx = Number(btn.dataset.accIdx);
            this.dashboardAccordionOpen = this.dashboardAccordionOpen === idx ? -1 : idx;
            this.renderPageContent();
            UI.refreshIcons();
          };
        });

        document.querySelectorAll('[data-sg-page]').forEach(btn => {
          btn.onclick = () => {
            const pg = btn.dataset.sgPage;
            const aid = btn.dataset.sgAn;
            if (pg === 'ternak' && aid) this.selectedAnimalId = aid;
            this.navigate(pg);
          };
        });

        // Checklist "Mulai dari sini"
        document.querySelectorAll('[data-start-step]').forEach(btn => {
          btn.onclick = () => {
            const step = btn.dataset.startStep;
            if (step === 'pengaturan') this.navigate('pengaturan');
            else if (step === 'sekat') this.openQuickAddPenModal();
            else if (step === 'ternak') this.openAddAnimalModal();
            else if (step === 'pakan') this.navigate('pakan');
          };
        });
      },

        const d = Store.data;

        if (all.length === 0) {
          return `
            <div class="max-w-xl mx-auto bento-card p-8 text-center">
              <div class="w-16 h-16 rounded-full bg-[#FBF6E3] border border-[#F5D547]/60 flex items-center justify-center mx-auto mb-4 text-[#2B2B2B]">
                <i data-lucide="beef" class="w-8 h-8"></i>
              </div>
              <h1 class="font-display text-2xl font-medium text-[#2B2B2B]">Belum ada data ternak</h1>
              <p class="text-sm text-[#7E8188] mt-1.5 mb-6">Mulai catat sapi, kambing, atau domba Anda untuk memantau bobot, kesehatan, dan Paspor QR.</p>
              <div class="flex flex-wrap justify-center gap-2.5">
                <button type="button" id="tr-add-single" class="btn-touch px-6 rounded-full bg-[#2B2B2B] text-white text-sm font-semibold">+ Tambah Ternak Pertama</button>
                <button type="button" id="tr-add-bulk" class="btn-touch px-5 rounded-full bg-white border border-black/15 text-[#2B2B2B] text-sm font-semibold">Mode Kelompok</button>
              </div>
            </div>
          `;
        }

        const filtered = all.filter(an => {
          if (f.status === 'aktif' && (an.status === 'terjual' || an.status === 'mati')) return false;
          if (f.status !== 'all' && f.status !== 'aktif' && an.status !== f.status) return false;
          if (f.species !== 'all' && an.species !== f.species) return false;
          if (f.pen !== 'all' && an.pen_id !== f.pen) return false;
          if (f.search) {
            const q = f.search.toLowerCase();
            if (!`${an.id} ${an.name} ${an.breed} ${an.origin}`.toLowerCase().includes(q)) return false;
          }
          return true;
        });

        return `
          <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-5">
            <div>
              <h1 class="font-display text-3xl font-normal text-[#2B2B2B]">Data Ternak</h1>
              <p class="text-xs text-[#6E7178] mt-1">Menampilkan ${filtered.length} dari ${all.length} catatan ternak${Store.mode === 'demo' ? ' • data contoh' : ''}</p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button type="button" id="tr-add-bulk" class="btn-touch px-4 rounded-full glass-pill hover:bg-white text-xs font-semibold text-[#2B2B2B]">
                + Mode Kelompok
              </button>
              <button type="button" id="tr-add-single" class="btn-touch px-5 rounded-full bg-[#2B2B2B] hover:bg-black text-white text-xs font-semibold inline-flex items-center gap-1.5 shadow-sm">
                <i data-lucide="plus" class="w-4 h-4 text-[#F5D547]"></i> Tambah Ternak
              </button>
            </div>
          </div>

          <!-- Pencarian & Filter Liquid Glass -->
          <div class="bento-card p-3.5 mb-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
            <input type="text" id="tr-search" value="${Utils.escapeHTML(f.search)}" placeholder="Cari ID, nama, atau ras..." class="h-11 px-4 rounded-full glass-tile text-xs" />
            <select id="tr-species" class="h-11 px-3.5 rounded-full glass-tile text-xs">
              <option value="all" ${f.species === 'all' ? 'selected' : ''}>Semua Jenis</option>
              <option value="Sapi" ${f.species === 'Sapi' ? 'selected' : ''}>Sapi</option>
              <option value="Kambing" ${f.species === 'Kambing' ? 'selected' : ''}>Kambing</option>
              <option value="Domba" ${f.species === 'Domba' ? 'selected' : ''}>Domba</option>
            </select>
            <select id="tr-pen" class="h-11 px-3.5 rounded-full glass-tile text-xs">
              <option value="all" ${f.pen === 'all' ? 'selected' : ''}>Semua Sekat</option>
              ${pens.map(p => `<option value="${p.id}" ${f.pen === p.id ? 'selected' : ''}>Sekat ${Utils.escapeHTML(p.code)}</option>`).join('')}
            </select>
            <select id="tr-status" class="h-11 px-3.5 rounded-full glass-tile text-xs">
              <option value="aktif" ${f.status === 'aktif' ? 'selected' : ''}>Semua Aktif di Kandang</option>
              <option value="sehat" ${f.status === 'sehat' ? 'selected' : ''}>Sehat</option>
              <option value="perhatian" ${f.status === 'perhatian' ? 'selected' : ''}>Perlu Perhatian</option>
              <option value="terjual" ${f.status === 'terjual' ? 'selected' : ''}>Terjual</option>
              <option value="mati" ${f.status === 'mati' ? 'selected' : ''}>Mati</option>
              <option value="all" ${f.status === 'all' ? 'selected' : ''}>Semua Status</option>
            </select>
          </div>

          <!-- Grid Kartu Ternak -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            ${filtered.length ? filtered.map(an => {
              const wt = Store.getLatestWeight(an);
              const pbbh = Store.getPBBH(an.id);
              const pen = pens.find(p => p.id === an.pen_id);
              const wd = Store.getActiveWithdrawal(an.id);
              const statusBadge = an.status === 'terjual'
                ? 'bg-black/75 text-white'
                : an.status === 'mati'
                ? 'bg-[#C93B36] text-white'
                : (an.status === 'perhatian' || wd)
                ? 'bg-[#FFF0D6] text-[#8F4B05]'
                : 'bg-[#E7F6EC] text-[#1D6E42]';
              const statusLabel = wd ? 'Masa Henti Obat' : an.status === 'perhatian' ? 'Perlu Perhatian' : an.status === 'terjual' ? 'Terjual' : an.status === 'mati' ? 'Mati' : 'Sehat';

              return `
                <article class="bento-card overflow-hidden flex flex-col justify-between cursor-pointer hover:shadow-md" data-open-animal="${an.id}">
                  <div>
                    <div class="h-36 relative bg-[#EAE5DC]">
                      ${an.photo
                        ? `<img src="${Utils.escapeHTML(an.photo)}" alt="${Utils.escapeHTML(an.name)}" class="w-full h-full object-cover" />`
                        : Utils.animalSVG(an.species, an.breed, 'crd_' + an.id)}
                      <div class="absolute inset-0 bg-gradient-to-t from-black/65 via-transparent to-black/15"></div>
                      <div class="absolute top-2.5 left-2.5 right-2.5 flex items-center justify-between gap-1">
                        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${statusBadge}">${statusLabel}</span>
                        <div class="flex items-center gap-1">
                          ${an.ready_for_sale && an.status !== 'terjual' ? `<span class="px-2 py-0.5 rounded-full bg-[#F5D547] text-[#2B2B2B] text-[10px] font-bold">Siap Jual</span>` : ''}
                          <button type="button" data-del-animal="${an.id}" class="w-7 h-7 rounded-full bg-black/45 hover:bg-[#C93B36] backdrop-blur-md text-white flex items-center justify-center transition" title="Hapus ternak ${Utils.escapeHTML(an.name)}" aria-label="Hapus ${Utils.escapeHTML(an.name)}">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                          </button>
                        </div>
                      </div>
                      <div class="absolute bottom-2.5 left-3 right-3 flex items-end justify-between text-white">
                        <div>
                          <div class="font-display text-lg font-medium leading-tight">${Utils.escapeHTML(an.name)}</div>
                          <div class="text-[10px] text-white/80">${an.id} • ${pen ? `Sekat ${Utils.escapeHTML(pen.code)}` : 'Tanpa sekat'}</div>
                        </div>
                        <span class="px-2.5 py-1 rounded-full bg-white text-[#2B2B2B] text-xs font-bold">${wt} kg</span>
                      </div>
                    </div>
                    <div class="p-3.5 text-xs space-y-1">
                      <div class="flex justify-between text-[#5A5D64]">
                        <span>${Utils.escapeHTML(an.breed)} (${an.sex})</span>
                        <span class="font-semibold text-[#2B2B2B]">${pbbh !== null ? `${pbbh >= 0 ? '+' : ''}${pbbh} kg/hr` : '-'}</span>
                      </div>
                      <div class="text-[11px] text-[#8E9096] truncate">${Utils.escapeHTML(an.notes || 'Ketuk untuk lihat profil & Paspor QR')}</div>
                    </div>
                  </div>
                </article>
              `;
            }).join('') : `
              <div class="sm:col-span-2 lg:col-span-3 xl:col-span-4 bento-card p-8 text-center text-sm text-[#7E8188]">
                Tidak ada ternak yang cocok dengan pencarian atau filter.
              </div>
            `}
          </div>
        `;
      },

      bindTernakEvents() {
        const addSingle = document.getElementById('tr-add-single');
        if (addSingle) addSingle.onclick = () => this.openAddAnimalModal();
        const addBulk = document.getElementById('tr-add-bulk');
        if (addBulk) addBulk.onclick = () => this.openBulkAddAnimalModal();

        const bindF = (id, key, evName = 'change') => {
          const el = document.getElementById(id);
          if (!el) return;
          el[evName] = () => {
            this.animalFilter[key] = el.value;
            this.renderPageContent();
            UI.refreshIcons();
          };
        };
        bindF('tr-search', 'search', 'onchange');
        bindF('tr-species', 'species', 'onchange');
        bindF('tr-pen', 'pen', 'onchange');
        bindF('tr-status', 'status', 'onchange');

        document.querySelectorAll('[data-open-animal]').forEach(card => {
          card.onclick = () => {
            this.selectedAnimalId = card.dataset.openAnimal;
            this.renderPageContent();
            UI.refreshIcons();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };
        });

        document.querySelectorAll('[data-del-animal]').forEach(btn => {
          btn.onclick = (e) => {
            e.stopPropagation();
            this.confirmDeleteAnimal(btn.dataset.delAnimal);
          };
        });
      },

      confirmDeleteAnimal(animalId) {
        const an = (Store.data.animals || []).find(a => a.id === animalId);
        if (!an) return;
        UI.confirm({
          title: `Hapus Ternak ${an.name} (${an.id})?`,
          message: `Data ${an.name} (${an.species} ${an.breed}) beserta seluruh riwayat bobot, catatan kesehatan, reproduksi, jadwal terkait, dan listing jualnya akan dihapus permanen dari mode aktif.`,
          confirmLabel: 'Ya, Hapus Ternak',
          danger: true,
          onConfirm: () => {
            const ok = Store.deleteAnimal(animalId);
            if (ok) {
              if (this.selectedAnimalId === animalId) this.selectedAnimalId = null;
              UI.toast(`Ternak ${an.name} (${an.id}) berhasil dihapus.`, 'info');
              this.renderPageContent();
              UI.refreshIcons();
            }
          }
        });
      },

      viewAnimalDetail() {
        const d = Store.data;
        const an = (d.animals || []).find(a => a.id === this.selectedAnimalId);
        if (!an) {
          this.selectedAnimalId = null;
          return this.viewTernak();
        }
        const weights = Store.getAnimalWeights(an.id);
        const latestW = Store.getLatestWeight(an);
        const pbbh = Store.getPBBH(an.id);
        const pen = (d.pens || []).find(p => p.id === an.pen_id);
        const health = (d.health_events || []).filter(e => e.animal_id === an.id).sort((a, b) => b.date.localeCompare(a.date));
        const repro = (d.reproduction_events || []).filter(r => r.animal_id === an.id);
        const wd = Store.getActiveWithdrawal(an.id);
        const feedLogs = (d.feed_logs || []).filter(l => l.pen_id === an.pen_id).slice(0, 4);

        // Grafik garis SVG riwayat bobot
        let chartSVG = '<p class="text-xs text-[#8E9096] py-8 text-center">Belum ada riwayat penimbangan.</p>';
        if (weights.length >= 2) {
          const wMin = Math.min(...weights.map(w => w.kg)) - 5;
          const wMax = Math.max(...weights.map(w => w.kg)) + 5;
          const span = Math.max(1, wMax - wMin);
          const pts = weights.map((w, i) => {
            const x = 24 + (i / (weights.length - 1)) * 272;
            const y = 115 - ((w.kg - wMin) / span) * 90;
            return { x, y, kg: w.kg, date: w.date };
          });
          const poly = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
          chartSVG = `
            <svg viewBox="0 0 320 140" class="w-full h-40">
              <polyline fill="none" stroke="#2B2B2B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${poly}"/>
              ${pts.map((p, i) => `
                <circle cx="${p.x}" cy="${p.y}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="${i === pts.length - 1 ? '#F5D547' : '#2B2B2B'}" stroke="#2B2B2B" stroke-width="1.5"/>
                <text x="${p.x}" y="${p.y - 9}" text-anchor="middle" font-size="9" font-weight="600" fill="#2B2B2B">${p.kg}</text>
                <text x="${p.x}" y="133" text-anchor="middle" font-size="8" fill="#8E9096">${Utils.formatShortDate(p.date)}</text>
              `).join('')}
            </svg>
          `;
        }

        return `
          <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
            <button type="button" id="ad-back" class="btn-touch px-4 rounded-full bg-white/90 border border-black/10 text-xs font-semibold text-[#2B2B2B] inline-flex items-center gap-1.5">
              <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Daftar Ternak
            </button>
            <div class="flex flex-wrap gap-2">
              <button type="button" id="ad-qr" class="btn-touch px-4 rounded-full bg-[#F5D547] hover:bg-[#EBC934] text-[#2B2B2B] text-xs font-bold inline-flex items-center gap-1.5">
                <i data-lucide="qr-code" class="w-4 h-4"></i> Paspor QR
              </button>
              <button type="button" id="ad-add-wt" class="btn-touch px-4 rounded-full bg-[#2B2B2B] text-white text-xs font-semibold inline-flex items-center gap-1.5">
                <i data-lucide="scale" class="w-4 h-4 text-[#F5D547]"></i> Catat Bobot
              </button>
              <button type="button" id="ad-mutate" class="btn-touch px-4 rounded-full bg-white border border-black/15 text-xs font-semibold text-[#2B2B2B]">
                Mutasi
              </button>
              ${Auth.isOwner() && an.status !== 'terjual' && an.status !== 'mati' ? `
                <button type="button" id="ad-sell" class="btn-touch px-4 rounded-full bg-[#E7F6EC] text-[#1D6E42] text-xs font-bold">
                  ${an.ready_for_sale ? 'Edit Listing Jual' : 'Tandai Siap Jual'}
                </button>
              ` : ''}
              <button type="button" id="ad-delete" class="btn-touch px-4 rounded-full bg-[#FDECEC] hover:bg-[#FAD6D5] text-[#9E2420] text-xs font-semibold inline-flex items-center gap-1.5">
                <i data-lucide="trash-2" class="w-4 h-4"></i> Hapus Ternak
              </button>
            </div>
          </div>

          ${wd ? `
            <div class="mb-4 p-4 rounded-3xl bg-[#FDECEC] border border-[#F5B7B5] text-xs text-[#9E2420] font-semibold">
              Masa henti obat aktif (${Utils.escapeHTML(wd.treatment)}) hingga ${Utils.formatDateID(wd.withdrawal_until)}. Jangan dijual/dipotong sebelum tanggal tersebut.
            </div>
          ` : ''}

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <!-- Kartu Identitas -->
            <div class="lg:col-span-5 bento-card overflow-hidden">
              <div class="h-52 relative bg-[#EAE5DC]">
                ${an.photo ? `<img src="${Utils.escapeHTML(an.photo)}" class="w-full h-full object-cover" />` : Utils.animalSVG(an.species, an.breed, 'det_' + an.id)}
                <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent"></div>
                <div class="absolute bottom-4 left-5 right-5 flex items-end justify-between text-white">
                  <div>
                    <div class="font-display text-3xl font-medium">${Utils.escapeHTML(an.name)}</div>
                    <div class="text-xs text-white/80">${an.id} • ${an.species} ${Utils.escapeHTML(an.breed)}</div>
                  </div>
                  <span class="px-3.5 py-1.5 rounded-full bg-[#F5D547] text-[#2B2B2B] text-sm font-bold">${latestW} kg</span>
                </div>
              </div>
              <div class="p-5 grid grid-cols-2 gap-3 text-xs">
                <div class="p-3 rounded-2xl bg-white border border-black/5"><span class="text-[#8E9096] block">Jenis Kelamin</span><strong class="text-[#2B2B2B]">${an.sex}</strong></div>
                <div class="p-3 rounded-2xl bg-white border border-black/5"><span class="text-[#8E9096] block">Umur Perkiraan</span><strong class="text-[#2B2B2B]">${Utils.calcAgeLabel(an.birth)}</strong></div>
                <div class="p-3 rounded-2xl bg-white border border-black/5"><span class="text-[#8E9096] block">Sekat Kandang</span><strong class="text-[#2B2B2B]">${pen ? `${pen.code} — ${Utils.escapeHTML(pen.name)}` : '-'}</strong></div>
                <div class="p-3 rounded-2xl bg-white border border-black/5"><span class="text-[#8E9096] block">Bobot Masuk</span><strong class="text-[#2B2B2B]">${an.entry_weight} kg (${Utils.formatShortDate(an.entry_date)})</strong></div>
                <div class="p-3 rounded-2xl bg-white border border-black/5"><span class="text-[#8E9096] block">Asal Ternak</span><strong class="text-[#2B2B2B]">${Utils.escapeHTML(an.origin || '-')}</strong></div>
                <div class="p-3 rounded-2xl bg-white border border-black/5"><span class="text-[#8E9096] block">PBBH Terakhir</span><strong class="text-[#1D6E42]">${pbbh !== null ? `${pbbh} kg/hari` : '-'}</strong></div>
                <div class="col-span-2 p-3 rounded-2xl bg-[#FBF6E3]/80 border border-[#F5D547]/40">
                  <span class="text-[#8E9096] block mb-0.5">Catatan Kandang</span>
                  <span class="text-[#2B2B2B]">${Utils.escapeHTML(an.notes || 'Tidak ada catatan khusus.')}</span>
                </div>
              </div>
            </div>

            <!-- Riwayat Bobot, Kesehatan, Pakan & Reproduksi -->
            <div class="lg:col-span-7 space-y-5">
              <div class="bento-card p-5">
                <div class="flex items-center justify-between mb-2">
                  <h2 class="text-base font-semibold text-[#2B2B2B]">Grafik Riwayat Bobot (${weights.length} catatan)</h2>
                  <span class="text-xs text-[#7E8188]">Kenaikan total: +${+(latestW - (an.entry_weight || 0)).toFixed(1)} kg</span>
                </div>
                ${chartSVG}
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bento-card p-5">
                  <h3 class="text-sm font-semibold text-[#2B2B2B] mb-3">Riwayat Kesehatan (${health.length})</h3>
                  <div class="space-y-2 text-xs">
                    ${health.length ? health.map(ev => `
                      <div class="p-3 rounded-2xl bg-white border border-black/5">
                        <div class="flex justify-between font-semibold">
                          <span>${Utils.escapeHTML(ev.type)}</span>
                          <span class="text-[#8E9096]">${Utils.formatShortDate(ev.date)}</span>
                        </div>
                        <div class="text-[#2B2B2B] mt-0.5">${Utils.escapeHTML(ev.treatment)}</div>
                        ${ev.withdrawal_until ? `<div class="text-[10px] text-[#9E2420] mt-0.5">Masa henti s/d ${Utils.formatDateID(ev.withdrawal_until)}</div>` : ''}
                      </div>
                    `).join('') : `<p class="text-[#8E9096]">Belum ada catatan kesehatan.</p>`}
                  </div>
                </div>

                <div class="bento-card p-5">
                  <h3 class="text-sm font-semibold text-[#2B2B2B] mb-3">${an.sex === 'Betina' ? `Reproduksi (${repro.length})` : `Riwayat Pakan Sekat (${feedLogs.length})`}</h3>
                  <div class="space-y-2 text-xs">
                    ${an.sex === 'Betina' ? (repro.length ? repro.map(r => `
                      <div class="p-3 rounded-2xl bg-white border border-black/5">
                        <div class="font-semibold text-[#2B2B2B]">${Utils.escapeHTML(r.type)} • ${Utils.escapeHTML(r.status)}</div>
                        <div class="text-[#7E8188] mt-0.5">Tanggal: ${Utils.formatDateID(r.date)}</div>
                        ${r.due_date ? `<div class="text-[#1D6E42] font-medium mt-0.5">Perkiraan lahir: ${Utils.formatDateID(r.due_date)}</div>` : ''}
                      </div>
                    `).join('') : `<p class="text-[#8E9096]">Belum ada catatan IB / kebuntingan.</p>`)
                    : (feedLogs.length ? feedLogs.map(fl => `
                      <div class="p-3 rounded-2xl bg-white border border-black/5">
                        <div class="font-semibold text-[#2B2B2B]">${Utils.escapeHTML(fl.ration_name)}</div>
                        <div class="text-[#7E8188] mt-0.5">${Utils.formatShortDate(fl.date)} • ${fl.total_kg} kg sekat</div>
                      </div>
                    `).join('') : `<p class="text-[#8E9096]">Belum ada catatan pakan di sekat ini.</p>`)}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      },

      bindAnimalDetailEvents() {
        document.getElementById('ad-back').onclick = () => {
          this.selectedAnimalId = null;
          this.renderPageContent(); UI.refreshIcons();
        };
        document.getElementById('ad-qr').onclick = () => this.openPassportQRModal(this.selectedAnimalId);
        document.getElementById('ad-add-wt').onclick = () => this.openRecordWeightModal(this.selectedAnimalId);
        document.getElementById('ad-mutate').onclick = () => this.openMutateAnimalModal(this.selectedAnimalId);
        const sellBtn = document.getElementById('ad-sell');
        if (sellBtn) sellBtn.onclick = () => this.openMarkForSaleModal(this.selectedAnimalId);
        const delBtn = document.getElementById('ad-delete');
        if (delBtn) delBtn.onclick = () => this.confirmDeleteAnimal(this.selectedAnimalId);
      },

      openAddAnimalModal() {
        const pens = Store.data.pens || [];
        const nextNum = String((Store.data.animals || []).length + 1).padStart(3, '0');
        let uploadedPhoto = '';

        UI.openModal({
          title: 'Tambah Ternak Baru',
          subtitle: 'ID otomatis dibuat, bisa diedit sesuai ear tag kandang',
          maxWidth: 'max-w-lg',
          bodyHTML: `
            <form id="form-add-animal" class="space-y-3">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-medium text-[#5A5D64] mb-1">ID Ternak *</label>
                  <input type="text" id="aa-id" value="SP-${nextNum}" class="w-full h-11 px-3.5 rounded-2xl bg-white border border-black/10 text-sm font-semibold" required />
                </div>
                <div>
                  <label class="block text-xs font-medium text-[#5A5D64] mb-1">Nama Panggilan *</label>
                  <input type="text" id="aa-name" placeholder="Contoh: Bintang" class="w-full h-11 px-3.5 rounded-2xl bg-white border border-black/10 text-sm" required />
                </div>
              </div>
              <div class="grid grid-cols-3 gap-2.5">
                <div>
                  <label class="block text-xs font-medium text-[#5A5D64] mb-1">Jenis</label>
                  <select id="aa-species" class="w-full h-11 px-2.5 rounded-2xl bg-white border border-black/10 text-xs">

              document.getElementById('aa-breed').value = e.target.value === 'Sapi' ? 'Limousin Cross' : 'Jawa Randu';
            };
            document.getElementById('aa-photo').onchange = async (e) => {
              const file = e.target.files?.[0];
              if (!file) return;
              try {
                uploadedPhoto = await Utils.compressImage(file, 480, 0.72);
                UI.toast('Foto ternak siap disimpan.', 'info');
              } catch (err) {
                UI.toast('Gagal memproses foto.', 'error');
              }
            };
            document.getElementById('form-add-animal').onsubmit = (e) => {
              e.preventDefault();
              const id = document.getElementById('aa-id').value.trim().toUpperCase();
              const name = document.getElementById('aa-name').value.trim();
              const wt = Number(document.getElementById('aa-wt').value);
              if (!id || !name || wt <= 0) return UI.toast('ID, nama, dan bobot masuk wajib diisi.', 'warning');
              if (Store.data.animals.some(a => a.id === id)) return UI.toast(`ID ${id} sudah dipakai ternak lain.`, 'error');
              const entryDate = document.getElementById('aa-entry').value || Utils.todayISO();
              Store.data.animals.unshift({
                id, farm_id: Store.data.farm.id, name,
                species: document.getElementById('aa-species').value,
                breed: document.getElementById('aa-breed').value.trim() || 'Lokal',
                sex: document.getElementById('aa-sex').value,
                birth: document.getElementById('aa-birth').value,
                origin: document.getElementById('aa-origin').value.trim() || 'Input kandang',
                entry_weight: wt, entry_date: entryDate,
                pen_id: document.getElementById('aa-pen').value,
                status: 'sehat',
                buy_price: Number(document.getElementById('aa-buy').value) || 0,
                ready_for_sale: false,
                photo: uploadedPhoto,
                notes: ''
              });
              Store.data.weights.push({ id: Utils.uid('wt'), animal_id: id, date: entryDate, kg: wt, method: 'Bobot Masuk' });
              Store.save();
              close();
              UI.toast(`${name} (${id}) berhasil ditambahkan.`, 'success');
              this.renderPageContent(); UI.refreshIcons();
            };
          }
        });

      openMutateAnimalModal(animalId) {
        const an = Store.data.animals.find(a => a.id === animalId);
        if (!an) return;
        const pens = Store.data.pens || [];
        UI.openModal({
          title: `Mutasi Ternak: ${an.name} (${an.id})`,
          maxWidth: 'max-w-sm',
          bodyHTML: `
            <form id="form-mut-an" class="space-y-3.5">
              <div>
                <label class="block text-xs font-medium text-[#5A5D64] mb-1">Jenis Mutasi</label>
                <select id="mu-type" class="w-full h-11 px-3 rounded-2xl bg-white border border-black/10 text-sm">
                  <option value="pindah">Pindah Sekat</option>
                  <option value="status">Ubah Status Kesehatan</option>
                  <option value="jual">Catat Terjual</option>
                  <option value="mati">Catat Mati (dengan alasan)</option>
                </select>
              </div>
              <div id="mu-pen-wrap">
                <label class="block text-xs font-medium text-[#5A5D64] mb-1">Sekat Baru</label>
                <select id="mu-pen" class="w-full h-11 px-3 rounded-2xl bg-white border border-black/10 text-sm">
                  ${pens.map(p => `<option value="${p.id}" ${p.id === an.pen_id ? 'selected' : ''}>Sekat ${Utils.escapeHTML(p.code)} — ${Utils.escapeHTML(p.name)}</option>`).join('')}
                </select>
              </div>
              <div id="mu-status-wrap" class="hidden">
                <label class="block text-xs font-medium text-[#5A5D64] mb-1">Status Baru</label>
                <select id="mu-status" class="w-full h-11 px-3 rounded-2xl bg-white border border-black/10 text-sm">
                  <option value="sehat">Sehat</option>
                  <option value="perhatian">Perlu Perhatian</option>
                </select>
              </div>
              <div id="mu-price-wrap" class="hidden">
                <label class="block text-xs font-medium text-[#5A5D64] mb-1">Harga Jual (Rp)</label>
                <input type="number" id="mu-price" placeholder="30000000" class="w-full h-11 px-3.5 rounded-2xl bg-white border border-black/10 text-sm" />
              </div>
              <div>
                <label class="block text-xs font-medium text-[#5A5D64] mb-1">Alasan / Catatan</label>
                <input type="text" id="mu-note" placeholder="Keterangan singkat..." class="w-full h-11 px-3.5 rounded-2xl bg-white border border-black/10 text-sm" />
              </div>
              <button type="submit" class="btn-touch w-full rounded-full bg-[#2B2B2B] text-white text-sm font-semibold">Simpan Mutasi</button>
            </form>
          `,
          onMount: (close) => {
            const typeSel = document.getElementById('mu-type');
            const syncVis = () => {
              const v = typeSel.value;
              document.getElementById('mu-pen-wrap').classList.toggle('hidden', v !== 'pindah');
              document.getElementById('mu-status-wrap').classList.toggle('hidden', v !== 'status');
              document.getElementById('mu-price-wrap').classList.toggle('hidden', v !== 'jual');
            };
            typeSel.onchange = syncVis;
            document.getElementById('form-mut-an').onsubmit = (e) => {
              e.preventDefault();
              const v = typeSel.value;
              const note = document.getElementById('mu-note').value.trim();
              if (v === 'pindah') {
                an.pen_id = document.getElementById('mu-pen').value;
                if (note) an.notes = note;
              } else if (v === 'status') {
                an.status = document.getElementById('mu-status').value;
                if (note) an.notes = note;
              } else if (v === 'jual') {
                if (Store.getActiveWithdrawal(an.id)) {
                  return UI.toast('Ternak masih dalam masa henti obat! Tunda penjualan.', 'error');
                }
                const price = Number(document.getElementById('mu-price').value) || 0;
                an.status = 'terjual';
                an.ready_for_sale = false;
                Store.data.listings = (Store.data.listings || []).filter(l => l.animal_id !== an.id);
                if (price > 0) {
                  Store.data.transactions.unshift({
                    id: Utils.uid('tx'), date: Utils.todayISO(), type: 'income',
                    category: 'Penjualan', amount: price,
                    note: `Penjualan ${an.name} (${an.id}) ${note ? '- ' + note : ''}`
                  });
                }
              } else if (v === 'mati') {
                if (!note) return UI.toast('Tuliskan alasan/penyebab kematian untuk catatan kandang.', 'warning');
                an.status = 'mati';
                an.ready_for_sale = false;
                an.notes = `Mati (${Utils.todayISO()}): ${note}`;
              }
              Store.save();
              close();
              UI.toast('Mutasi ternak berhasil dicatat.', 'success');
              this.renderPageContent(); UI.refreshIcons();
            };
          }
        });
      },

      openMarkForSaleModal(animalId) {
        const an = Store.data.animals.find(a => a.id === animalId);
        if (!an) return;
        if (Store.getActiveWithdrawal(an.id)) {
          return UI.toast('Ternak ini masih dalam masa henti obat. Belum boleh ditandai siap dijual.', 'error');
        }
        const existing = (Store.data.listings || []).find(l => l.animal_id === an.id);
        const estPrice = existing?.price || Math.round(Store.getLatestWeight(an) * (an.species === 'Sapi' ? 62000 : 88000));

        UI.openModal({
          title: `Tandai Siap Jual: ${an.name}`,
          subtitle: 'Akan muncul otomatis di katalog halaman Jual lengkap dengan Paspor QR',
          maxWidth: 'max-w-sm',
          bodyHTML: `
            <form id="form-mark-sale" class="space-y-3.5">
              <div>
                <label class="block text-xs font-medium text-[#5A5D64] mb-1">Harga Penawaran (Rp) *</label>
                <input type="number" id="ms-price" value="${estPrice}" min="100000" class="w-full h-11 px-3.5 rounded-2xl bg-white border border-black/10 text-sm font-semibold" required />
              </div>
              <div>
                <label class="block text-xs font-medium text-[#5A5D64] mb-1">Lokasi Kandang</label>
                <input type="text" id="ms-loc" value="${Utils.escapeHTML(existing?.location || Store.data.farm.location || 'Indonesia')}" class="w-full h-11 px-3.5 rounded-2xl bg-white border border-black/10 text-sm" />
              </div>
              <div>
                <label class="block text-xs font-medium text-[#5A5D64] mb-1">Deskripsi untuk Pembeli</label>
                <textarea id="ms-desc" rows="2" class="w-full p-3 rounded-2xl bg-white border border-black/10 text-xs">${Utils.escapeHTML(existing?.description || `${an.breed} ${an.sex}, bobot terakhir ${Store.getLatestWeight(an)} kg, kondisi sehat dan terawat.`)}</textarea>
              </div>
              <button type="submit" class="btn-touch w-full rounded-full bg-[#2B2B2B] text-white text-sm font-semibold">Simpan ke Katalog Jual</button>
            </form>
          `,
          onMount: (close) => {
            document.getElementById('form-mark-sale').onsubmit = (e) => {
              e.preventDefault();
              const price = Number(document.getElementById('ms-price').value);
              if (price <= 0) return UI.toast('Masukkan harga penawaran yang valid.', 'warning');
              an.ready_for_sale = true;
              const payload = {
                id: existing?.id || Utils.uid('lst'),
                farm_id: Store.data.farm.id,
                animal_id: an.id,
                price,
                location: document.getElementById('ms-loc').value.trim() || Store.data.farm.location || 'Indonesia',
                description: document.getElementById('ms-desc').value.trim(),
                created_at: existing?.created_at || Utils.todayISO(),
                is_demo: Store.mode === 'demo'
              };
              if (existing) Object.assign(existing, payload);
              else Store.data.listings.unshift(payload);
              Store.save();
              close();
              UI.toast(`${an.name} masuk katalog siap dijual.`, 'success');
              this.renderPageContent(); UI.refreshIcons();
            };
          }
        });
      },

      /* -----------------------------------------------------------------------
         6.4 & 6.5 HALAMAN PAKAN, MIXER RANSUM (A vs B) & KALKULATOR SCHOORL/HPP
      ----------------------------------------------------------------------- */
      ensureMixerDraft() {
        const feeds = Store.data.feeds || [];
        if (!this.mixerDraft || this.mixerDraft._mode !== Store.mode) {
          const rA = (Store.data.rations || [])[0];
          const rB = (Store.data.rations || [])[1];
          const toMap = (rat) => {
            const map = {};
            feeds.forEach(f => { map[f.id] = 0; });
            if (rat && Array.isArray(rat.items)) {
              rat.items.forEach(it => { map[it.feed_id] = Number(it.kg) || 0; });
            }
            return map;
          };
          this.mixerDraft = {
            _mode: Store.mode,
            nameA: rA?.name || 'Formula A • Penggemukan Cepat',
            nameB: rB?.name || 'Formula B • Hemat Harian',
            A: toMap(rA),
            B: toMap(rB)
          };
        } else {
          feeds.forEach(f => {
            if (this.mixerDraft.A[f.id] === undefined) this.mixerDraft.A[f.id] = 0;
            if (this.mixerDraft.B[f.id] === undefined) this.mixerDraft.B[f.id] = 0;
          });
        }
        return this.mixerDraft;
      },

      calcRationStats(kgMap) {
        const feeds = Store.data.feeds || [];
        let totalKg = 0, totalCost = 0, weightedPK = 0, weightedTDN = 0;
        feeds.forEach(f => {
          const kg = Math.max(0, Number(kgMap[f.id]) || 0);
          totalKg += kg;
          totalCost += kg * (Number(f.price) || 0);
          weightedPK += kg * (Number(f.pk) || 0);
          weightedTDN += kg * (Number(f.tdn) || 0);
        });
        return {
          totalKg: +totalKg.toFixed(1),
          totalCost: Math.round(totalCost),
          costPerKg: totalKg > 0 ? Math.round(totalCost / totalKg) : 0,
          pk: totalKg > 0 ? +(weightedPK / totalKg).toFixed(1) : 0,
          tdn: totalKg > 0 ? +(weightedTDN / totalKg).toFixed(1) : 0
        };
      },

      viewPakan() {
        const d = Store.data;
        const today = Utils.todayISO();
        const feeds = d.feeds || [];
        const logs = [...(d.feed_logs || [])].sort((a, b) => b.date.localeCompare(a.date));
        const todayCost = logs.filter(l => l.date === today).reduce((s, x) => s + (Number(x.cost) || 0), 0);
        const lowCount = feeds.filter(f => f.daily_use_kg > 0 && Math.floor(f.stock_kg / f.daily_use_kg) <= 5).length;

        const tabs = [
          { id: 'bahan', label: 'Bahan & Stok', icon: 'package' },
          { id: 'mixer', label: 'Mixer Ransum', icon: 'sliders-horizontal' },
          { id: 'harian', label: 'Catat Harian', icon: 'clipboard-list' },
          { id: 'kalkulator', label: 'Schoorl & HPP', icon: 'calculator' }
        ];

        return `
          <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4 mb-5">
            <div>
              <h1 class="font-display text-3xl font-normal text-[#2B2B2B]">Pakan & Biaya</h1>
              <p class="text-xs text-[#6E7178] mt-1">Kelola stok bahan pakan, racik perbandingan ransum A vs B, dan hitung bobot Schoorl & HPP${Store.mode === 'demo' ? ' • data contoh' : ''}</p>
            </div>
            <div class="flex items-center gap-1 p-1.5 rounded-full glass-pill overflow-x-auto no-scrollbar max-w-full">
              ${tabs.map(tb => `
                <button type="button" data-pk-tab="${tb.id}" class="px-3.5 h-9 rounded-full text-xs font-semibold whitespace-nowrap shrink-0 inline-flex items-center gap-1.5 transition ${this.pakanTab === tb.id ? 'bg-[#2B2B2B] text-white shadow-sm' : 'text-[#5A5D64] hover:bg-white/75 hover:text-[#2B2B2B]'}">
                  <i data-lucide="${tb.icon}" class="w-3.5 h-3.5 ${this.pakanTab === tb.id ? 'text-[#F5D547]' : ''}"></i>
                  <span>${tb.label}</span>
                </button>
              `).join('')}
            </div>
          </div>

          <!-- 3 Kartu Ringkasan KPI Liquid Glass -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-5">
            <div class="bento-card p-5">
              <div class="text-[11px] font-medium text-[#6E7178]">Biaya Pakan Hari Ini</div>
              <div class="font-metric text-3xl text-[#2B2B2B] mt-1">${Utils.formatRp(todayCost)}</div>
              <div class="text-[11px] text-[#6E7178] mt-0.5">Anggaran: ${Utils.formatRp(d.farm.daily_feed_budget || 500000)}/hari</div>
            </div>
            <div class="bento-card p-5">
              <div class="text-[11px] font-medium text-[#6E7178]">Bahan Pakan Tercatat</div>
              <div class="font-metric text-3xl text-[#2B2B2B] mt-1">${feeds.length} <span class="text-sm text-[#6E7178]">jenis</span></div>
              <div class="text-[11px] font-semibold mt-0.5 ${lowCount ? 'text-[#C93B36]' : 'text-[#1D6E42]'}">${lowCount ? `${lowCount} bahan stok menipis (≤5 hari)` : 'Semua stok pakan aman'}</div>
            </div>
            <div class="bento-card p-5">
              <div class="text-[11px] font-medium text-[#6E7178]">Formula Ransum Tersimpan</div>
              <div class="font-metric text-3xl text-[#2B2B2B] mt-1">${(d.rations || []).length}</div>
              <div class="text-[11px] text-[#6E7178] mt-0.5">Bandingkan nutrisi & biaya di tab Mixer</div>

          </div>

          ${this.pakanTab === 'bahan' ? this.viewPakanBahan()
            : this.pakanTab === 'mixer' ? this.viewPakanMixer()
            : this.pakanTab === 'harian' ? this.viewPakanHarian()
            : this.viewPakanKalkulator()}
        `;
      },

      viewPakanBahan() {
        const feeds = Store.data.feeds || [];
        return `
          <div class="flex justify-end mb-4">
            <button type="button" id="pk-add-feed" class="btn-touch px-5 rounded-full bg-[#2B2B2B] hover:bg-black text-white text-xs font-semibold inline-flex items-center gap-1.5">
              <i data-lucide="plus" class="w-4 h-4 text-[#F5D547]"></i> Tambah Bahan Pakan
            </button>
          </div>
          ${feeds.length ? `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${feeds.map(f => {
                const daysLeft = f.daily_use_kg > 0 ? Math.floor(f.stock_kg / f.daily_use_kg) : null;
                const isLow = daysLeft !== null && daysLeft <= 5;
                const barPct = daysLeft !== null ? Math.min(100, Math.max(8, Math.round((daysLeft / 14) * 100))) : 50;
                return `
                  <article class="bento-card p-5 space-y-3.5 ${isLow ? 'border-[#F5B7B5]' : ''}">
                    <div class="flex items-start justify-between gap-2">
                      <div>
                        <h3 class="font-display text-lg font-semibold text-[#2B2B2B] leading-tight">${Utils.escapeHTML(f.name)}</h3>
                        <div class="text-[11px] text-[#6E7178] mt-0.5">PK <strong>${f.pk}%</strong> • TDN <strong>${f.tdn}%</strong></div>
                      </div>
                      ${daysLeft !== null ? `
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold shrink-0 ${isLow ? 'bg-[#FDECEC] text-[#9E2420]' : 'bg-[#E7F6EC] text-[#1D6E42]'}">
                          Habis ±${Math.max(1, daysLeft)} hr
                        </span>
                      ` : ''}
                    </div>

                    <!-- Progress ketahanan stok -->
                    <div>
                      <div class="flex justify-between text-[11px] text-[#5A5D64] mb-1">
                        <span>Stok: <strong>${f.stock_kg} kg</strong></span>
                        <span>Pakai: ${f.daily_use_kg} kg/hr</span>
                      </div>
                      <div class="h-2 rounded-full bg-black/[0.06] overflow-hidden">
                        <div class="h-full rounded-full ${isLow ? 'bg-[#C93B36]' : 'bg-[#F5D547]'}" style="width:${barPct}%"></div>
                      </div>
                    </div>

                    <!-- Edit Harga & Stok Inline -->
                    <div class="grid grid-cols-2 gap-2.5 pt-2 border-t border-black/[0.06] text-xs">
                      <div>
                        <label class="block text-[10px] text-[#6E7178] mb-1">Harga (Rp/kg)</label>
                        <input type="number" data-feed-price="${f.id}" value="${f.price}" min="0" class="w-full h-10 px-3 rounded-2xl glass-tile font-semibold text-[#2B2B2B]" />
                      </div>
                      <div>
                        <label class="block text-[10px] text-[#6E7178] mb-1">Stok Saat Ini (kg)</label>
                        <input type="number" data-feed-stock="${f.id}" value="${f.stock_kg}" min="0" class="w-full h-10 px-3 rounded-2xl glass-tile font-semibold text-[#2B2B2B]" />
                      </div>
                    </div>
                  </article>
                `;
              }).join('')}
            </div>
          ` : `
            <div class="bento-card p-8 text-center">
              <h2 class="font-display text-xl font-medium text-[#2B2B2B]">Belum ada bahan pakan</h2>
              <p class="text-xs text-[#6E7178] mt-1 mb-5">Tambahkan hijauan, konsentrat, dedak, atau ampas tahu untuk mulai menghitung biaya ransum.</p>
              <button type="button" id="pk-add-feed-empty" class="btn-touch px-6 rounded-full bg-[#2B2B2B] text-white text-xs font-semibold">+ Tambah Bahan Pertama</button>
            </div>
          `}
        `;
      },

      viewPakanMixer() {
        const feeds = Store.data.feeds || [];
        if (!feeds.length) {
          return `<div class="bento-card p-8 text-center text-sm text-[#6E7178]">Tambahkan minimal 1 bahan pakan di tab <strong>Bahan & Stok</strong> terlebih dahulu untuk menggunakan Mixer Ransum.</div>`;
        }
        const draft = this.ensureMixerDraft();
        const stA = this.calcRationStats(draft.A);
        const stB = this.calcRationStats(draft.B);
        const diffDay = stA.totalCost - stB.totalCost;

        return `
          <div class="space-y-5">
            <!-- Ringkasan Perbandingan Formula A vs B -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${[
                { key: 'A', name: draft.nameA, st: stA, dark: true },
                { key: 'B', name: draft.nameB, st: stB, dark: false }
              ].map(card => `
                <div class="${card.dark ? 'bento-card-dark' : 'bento-card'} p-5 space-y-3">
                  <div class="flex items-center justify-between gap-2">
                    <span class="px-3 py-1 rounded-full text-[10px] font-bold ${card.dark ? 'bg-[#F5D547] text-[#2B2B2B]' : 'bg-[#2B2B2B] text-white'}">FORMULA ${card.key}</span>
                    <span class="text-xs ${card.dark ? 'text-white/75' : 'text-[#6E7178]'}">${card.st.totalKg} kg / ekor / hari</span>
                  </div>
                  <div class="font-display text-lg font-semibold ${card.dark ? 'text-white' : 'text-[#2B2B2B]'}">${Utils.escapeHTML(card.name)}</div>
                  <div class="grid grid-cols-3 gap-2 pt-1">
                    <div class="p-3 rounded-2xl ${card.dark ? 'bg-white/10' : 'glass-tile'}">
                      <div class="text-[10px] ${card.dark ? 'text-white/65' : 'text-[#6E7178]'}">Total PK%</div>
                      <div class="font-metric text-2xl ${card.dark ? 'text-[#F5D547]' : 'text-[#2B2B2B]'}">${card.st.pk}%</div>
                    </div>
                    <div class="p-3 rounded-2xl ${card.dark ? 'bg-white/10' : 'glass-tile'}">
                      <div class="text-[10px] ${card.dark ? 'text-white/65' : 'text-[#6E7178]'}">Total TDN%</div>
                      <div class="font-metric text-2xl ${card.dark ? 'text-white' : 'text-[#2B2B2B]'}">${card.st.tdn}%</div>
                    </div>
                    <div class="p-3 rounded-2xl ${card.dark ? 'bg-white/10' : 'glass-tile'}">
                      <div class="text-[10px] ${card.dark ? 'text-white/65' : 'text-[#6E7178]'}">Biaya / kg</div>
                      <div class="font-display text-base font-bold ${card.dark ? 'text-white' : 'text-[#2B2B2B]'} mt-1">${Utils.formatRp(card.st.costPerKg)}</div>
                    </div>
                  </div>
                  <div class="pt-2 border-t ${card.dark ? 'border-white/10' : 'border-black/[0.06]'} flex items-center justify-between text-xs">
                    <span class="${card.dark ? 'text-white/70' : 'text-[#6E7178]'}">Biaya per ekor per hari</span>
                    <strong class="font-display text-xl ${card.dark ? 'text-[#F5D547]' : 'text-[#2B2B2B]'}">${Utils.formatRp(card.st.totalCost)}</strong>
                  </div>
                </div>
              `).join('')}
            </div>

            <!-- Insight Selisih Otomatis -->
            <div class="p-4 rounded-3xl glass-tile text-xs text-[#2B2B2B] flex flex-wrap items-center justify-between gap-2">
              <div>
                <strong>Perbandingan:</strong>
                ${diffDay === 0
                  ? 'Biaya harian Formula A dan B sama besar.'
                  : diffDay > 0
                  ? `Formula B lebih hemat <strong>${Utils.formatRp(diffDay)}/ekor/hari</strong> (${Utils.formatRp(diffDay * 30)}/bln), sedangkan selisih PK adalah ${(stA.pk - stB.pk).toFixed(1)}%.`
                  : `Formula A lebih hemat <strong>${Utils.formatRp(Math.abs(diffDay))}/ekor/hari</strong> (${Utils.formatRp(Math.abs(diffDay) * 30)}/bln), dengan selisih PK ${(stA.pk - stB.pk).toFixed(1)}%.`}
              </div>
              <button type="button" id="mx-save-rations" class="btn-touch px-5 rounded-full bg-[#2B2B2B] text-white text-xs font-semibold">Simpan Formula A & B</button>
            </div>

            <!-- Tabel Input Takaran (kg/ekor/hari) -->
            <div class="bento-card p-5 overflow-x-auto">
              <h3 class="text-sm font-semibold text-[#2B2B2B] mb-3">Atur Komposisi Bahan (kg per ekor per hari)</h3>
              <div class="space-y-2.5 min-w-[320px]">
                <div class="grid grid-cols-12 gap-2 px-2 text-[11px] font-semibold text-[#6E7178]">
                  <div class="col-span-6">Bahan Pakan (PK / TDN / Harga)</div>
                  <div class="col-span-3 text-center">Formula A (kg)</div>
                  <div class="col-span-3 text-center">Formula B (kg)</div>
                </div>
                ${feeds.map(f => `
                  <div class="grid grid-cols-12 gap-2 items-center p-2.5 rounded-2xl glass-tile text-xs">
                    <div class="col-span-6 min-w-0">
                      <strong class="text-[#2B2B2B] block truncate">${Utils.escapeHTML(f.name)}</strong>
                      <span class="text-[10px] text-[#6E7178]">PK ${f.pk}% • TDN ${f.tdn}% • ${Utils.formatRp(f.price)}/kg</span>
                    </div>
                    <div class="col-span-3">
                      <input type="number" step="0.5" min="0" data-mx-slot="A" data-mx-fid="${f.id}" value="${draft.A[f.id] || 0}" class="w-full h-10 px-2.5 rounded-xl bg-white border border-black/10 text-center font-semibold text-[#2B2B2B]" />
                    </div>
                    <div class="col-span-3">
                      <input type="number" step="0.5" min="0" data-mx-slot="B" data-mx-fid="${f.id}" value="${draft.B[f.id] || 0}" class="w-full h-10 px-2.5 rounded-xl bg-white border border-black/10 text-center font-semibold text-[#2B2B2B]" />
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      },

      viewPakanHarian() {
        const d = Store.data;
        const pens = d.pens || [];
        const logs = [...(d.feed_logs || [])].sort((a, b) => b.date.localeCompare(a.date));
        const rations = d.rations || [];

        return `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <form id="form-feed-log" class="lg:col-span-5 bento-card p-5 space-y-3.5 h-fit">
              <h2 class="text-base font-semibold text-[#2B2B2B]">Catat Pemberian Pakan Harian</h2>
              <div>
                <label class="block text-xs font-medium text-[#5A5D64] mb-1">Sekat Kandang</label>
                <select id="fl-pen" class="w-full h-11 px-3 rounded-2xl bg-white border border-black/10 text-xs">
                  <option value="">-- Semua / Umum --</option>
                  ${pens.map(p => `<option value="${p.id}">Sekat ${Utils.escapeHTML(p.code)} — ${Utils.escapeHTML(p.name)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-[#5A5D64] mb-1">Ransum / Jenis Pakan *</label>
                <input type="text" id="fl-name" list="fl-ration-list" value="${Utils.escapeHTML(rations[0]?.name || 'Pakan Harian Pagi')}" class="w-full h-11 px-3.5 rounded-2xl bg-white border border-black/10 text-xs" required />
                <datalist id="fl-ration-list">
                  ${rations.map(r => `<option value="${Utils.escapeHTML(r.name)}"></option>`).join('')}
                </datalist>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-medium text-[#5A5D64] mb-1">Total Berat (kg) *</label>
                  <input type="number" step="0.5" id="fl-kg" value="150" min="1" class="w-full h-11 px-3 rounded-2xl bg-white border border-black/10 text-sm font-semibold" required />
                </div>
                <div>
                  <label class="block text-xs font-medium text-[#5A5D64] mb-1">Biaya Total (Rp) *</label>
                  <input type="number" id="fl-cost" value="195000" min="0" class="w-full h-11 px-3 rounded-2xl bg-white border border-black/10 text-sm font-semibold" required />
                </div>
              </div>
              <div>
                <label class="block text-xs font-medium text-[#5A5D64] mb-1">Tanggal</label>
                <input type="date" id="fl-date" value="${Utils.todayISO()}" class="w-full h-11 px-3 rounded-2xl bg-white border border-black/10 text-xs" />
              </div>
              <button type="submit" class="btn-touch w-full rounded-full bg-[#2B2B2B] text-white text-xs font-semibold">Simpan Pemberian Pakan</button>
            </form>

            <div class="lg:col-span-7 bento-card p-5 space-y-3">
              <h2 class="text-base font-semibold text-[#2B2B2B]">Riwayat Pemberian Pakan (${logs.length})</h2>
              <div class="space-y-2">
                ${logs.length ? logs.slice(0, 20).map(l => {
                  const pen = pens.find(p => p.id === l.pen_id);
                  return `
                    <div class="p-3.5 rounded-2xl glass-tile flex items-center justify-between gap-3 text-xs">
                      <div class="min-w-0">
                        <div class="font-semibold text-[#2B2B2B] truncate">${Utils.escapeHTML(l.ration_name)}</div>
                        <div class="text-[#6E7178]">${Utils.formatDateID(l.date)} • ${pen ? `Sekat ${Utils.escapeHTML(pen.code)}` : 'Umum'} • ${l.total_kg} kg • oleh ${Utils.escapeHTML(l.recorded_by || '-')}</div>
                      </div>
                      <strong class="text-[#2B2B2B] shrink-0">${Utils.formatRp(l.cost)}</strong>
                    </div>
                  `;
                }).join('') : `<p class="text-xs text-[#6E7178] text-center py-8">Belum ada catatan pemberian pakan harian.</p>`}
              </div>
            </div>
          </div>
        `;
      },

      viewPakanKalkulator() {
        const s = this.schoorlState;
        const active = Store.getActiveAnimals();
        const chest = Math.max(40, Number(s.chestCm) || 170);
        // Rumus Schoorl standar: Sapi = (LD + 22)^2 / 100; Kambing/Domba = (LD + 18)^2 / 100
        const constAdd = s.species === 'Sapi' ? 22 : 18;
        const estWeight = +(((chest + constAdd) ** 2) / 100).toFixed(1);
        const carcassPct = Math.min(65, Math.max(35, Number(s.carcassPct) || 50));
        const estCarcass = +(estWeight * (carcassPct / 100)).toFixed(1);

        const totalHPP = (Number(s.buyPrice) || 0) + (Number(s.feedCost) || 0) + (Number(s.medCost) || 0) + (Number(s.laborCost) || 0);
        const hppPerKg = estWeight > 0 ? Math.round(totalHPP / estWeight) : 0;
        const marketVal = Math.round(estWeight * (Number(s.marketPricePerKg) || 0));
        const estProfit = marketVal - totalHPP;

        return `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <!-- Kalkulator Bobot Badan (Rumus Schoorl) -->
            <div class="lg:col-span-6 bento-card p-5 space-y-4">
              <div>
                <h2 class="text-base font-semibold text-[#2B2B2B]">Kalkulator Bobot Badan (Rumus Schoorl)</h2>
                <p class="text-xs text-[#6E7178] mt-0.5">Ukur lingkar dada di belakang kaki depan dengan pita ukur (cm).</p>
              </div>

              <div class="grid grid-cols-2 gap-3 text-xs">
                <div>
                  <label class="block text-[#5A5D64] mb-1">Jenis Ternak</label>
                  <select id="sc-species" class="w-full h-11 px-3 rounded-2xl bg-white border border-black/10 font-semibold">
                    <option value="Sapi" ${s.species === 'Sapi' ? 'selected' : ''}>Sapi (LD + 22)² / 100</option>
                    <option value="Kambing" ${s.species !== 'Sapi' ? 'selected' : ''}>Kambing/Domba (LD + 18)² / 100</option>
                  </select>
                </div>
                <div>
                  <label class="block text-[#5A5D64] mb-1">Persen Karkas (%)</label>
                  <input type="number" id="sc-carcass" value="${carcassPct}" min="35" max="65" class="w-full h-11 px-3 rounded-2xl bg-white border border-black/10 font-semibold" />
                </div>
              </div>

              <div>
                <div class="flex justify-between text-xs mb-1">
                  <span class="text-[#5A5D64] font-medium">Lingkar Dada (cm)</span>
                  <strong class="text-[#2B2B2B]">${chest} cm</strong>
                </div>
                <div class="flex items-center gap-3">
                  <input type="range" id="sc-chest-range" min="${s.species === 'Sapi' ? 110 : 45}" max="${s.species === 'Sapi' ? 230 : 110}" value="${chest}" class="flex-1 accent-[#2B2B2B]" />
                  <input type="number" id="sc-chest-num" value="${chest}" min="40" max="260" class="w-20 h-10 px-2.5 rounded-xl bg-white border border-black/10 text-center text-sm font-semibold" />
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div class="p-4 rounded-3xl bg-[#2B2B2B] text-white">
                  <div class="text-[11px] text-white/70">Estimasi Bobot Hidup</div>
                  <div class="font-metric text-4xl text-[#F5D547] mt-1">${estWeight} <span class="text-sm text-white/80">kg</span></div>
                </div>
                <div class="p-4 rounded-3xl glass-tile">
                  <div class="text-[11px] text-[#6E7178]">Perkiraan Karkas (${carcassPct}%)</div>
                  <div class="font-metric text-4xl text-[#2B2B2B] mt-1">${estCarcass} <span class="text-sm text-[#6E7178]">kg</span></div>
                </div>
              </div>

              <div class="pt-3 border-t border-black/[0.06] space-y-2.5">
                <label class="block text-xs font-medium text-[#5A5D64]">Simpan Hasil Ukur ke Riwayat Bobot Ternak</label>
                <div class="flex flex-col sm:flex-row gap-2">
                  <select id="sc-animal" class="flex-1 h-11 px-3 rounded-2xl bg-white border border-black/10 text-xs">
                    <option value="">-- Pilih ternak --</option>
                    ${active.map(a => `<option value="${a.id}" ${s.animalId === a.id ? 'selected' : ''}>${a.id} — ${Utils.escapeHTML(a.name)} (${Store.getLatestWeight(a)} kg)</option>`).join('')}
                  </select>
                  <button type="button" id="sc-save-wt" class="btn-touch px-5 rounded-full glass-accent text-[#2B2B2B] text-xs font-bold shrink-0">
                    Simpan Bobot
                  </button>
                </div>
              </div>
            </div>

            <!-- Kalkulator HPP & Estimasi Untung -->
            <div class="lg:col-span-6 bento-card p-5 space-y-4">
              <div>
                <h2 class="text-base font-semibold text-[#2B2B2B]">Kalkulator HPP & Estimasi Untung</h2>
                <p class="text-xs text-[#6E7178] mt-0.5">Terhubung langsung ke estimasi bobot ${estWeight} kg di samping.</p>
              </div>

              <div class="grid grid-cols-2 gap-3 text-xs">
                <div>
                  <label class="block text-[#5A5D64] mb-1">Harga Beli Bakalan (Rp)</label>
                  <input type="number" id="hpp-buy" value="${s.buyPrice}" class="w-full h-11 px-3 rounded-2xl bg-white border border-black/10 font-semibold" />
                </div>
                <div>
                  <label class="block text-[#5A5D64] mb-1">Total Biaya Pakan (Rp)</label>
                  <input type="number" id="hpp-feed" value="${s.feedCost}" class="w-full h-11 px-3 rounded-2xl bg-white border border-black/10 font-semibold" />
                </div>
                <div>
                  <label class="block text-[#5A5D64] mb-1">Obat & Kesehatan (Rp)</label>
                  <input type="number" id="hpp-med" value="${s.medCost}" class="w-full h-11 px-3 rounded-2xl bg-white border border-black/10 font-semibold" />
                </div>
                <div>
                  <label class="block text-[#5A5D64] mb-1">Tenaga Kerja & Lainnya (Rp)</label>
                  <input type="number" id="hpp-labor" value="${s.laborCost}" class="w-full h-11 px-3 rounded-2xl bg-white border border-black/10 font-semibold" />
                </div>
                <div class="col-span-2">
                  <label class="block text-[#5A5D64] mb-1">Harga Pasar Hidup Saat Ini (Rp/kg)</label>
                  <input type="number" id="hpp-mkt" value="${s.marketPricePerKg}" class="w-full h-11 px-3 rounded-2xl bg-[#FBF6E3] border border-[#F5D547] font-bold text-[#2B2B2B]" />
                </div>
              </div>

              <div class="p-4 rounded-3xl glass-tile space-y-2 text-xs">
                <div class="flex justify-between">
                  <span class="text-[#6E7178]">Total HPP per Ekor</span>
                  <strong class="text-[#2B2B2B]">${Utils.formatRp(totalHPP)} (${Utils.formatRp(hppPerKg)}/kg)</strong>
                </div>
                <div class="flex justify-between">
                  <span class="text-[#6E7178]">Estimasi Harga Jual (${estWeight} kg)</span>
                  <strong class="text-[#2B2B2B]">${Utils.formatRp(marketVal)}</strong>
                </div>
                <div class="pt-2 border-t border-black/[0.06] flex justify-between items-baseline">
                  <span class="font-semibold text-[#2B2B2B]">Estimasi Untung / Rugi</span>
                  <strong class="font-display text-2xl ${estProfit >= 0 ? 'text-[#1D6E42]' : 'text-[#9E2420]'}">${Utils.formatRp(estProfit)}</strong>
                </div>
              </div>
            </div>
          </div>
        `;
      },

      bindPakanEvents() {
        document.querySelectorAll('[data-pk-tab]').forEach(btn => {
          btn.onclick = () => {
            this.pakanTab = btn.dataset.pkTab;
            this.renderPageContent(); UI.refreshIcons();
          };
        });

        const openAddFeed = () => {
          UI.openModal({
            title: 'Tambah Bahan Pakan',
            maxWidth: 'max-w-sm',
            bodyHTML: `
              <form id="form-add-feed" class="space-y-3">
                <div>
                  <label class="block text-xs font-medium text-[#5A5D64] mb-1">Nama Bahan Pakan *</label>

                <div class="grid grid-cols-3 gap-2">
                  <div>
                    <label class="block text-[11px] text-[#5A5D64] mb-1">Harga/kg</label>

                    <label class="block text-[11px] text-[#5A5D64] mb-1">PK (%)</label>

                </div>

                  <div>
                    <label class="block text-xs font-medium text-[#5A5D64] mb-1">Stok Awal (kg)</label>
